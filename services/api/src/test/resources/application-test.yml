spring:
  task:
    scheduling:
      enabled: false
  mail:
    host: localhost
    port: 1025

yukcsca:
  admin:
    first-email: admin@example.com
  auth:
    google-client-id: test-google-client
    jwt-secret: 01234567890123456789012345678901
    issuer: https://api.test
    web-origin: https://app.test
    cookie-secure: true
    cookie-same-site: Lax
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    rate-limit:
      requests: 3
      window: 1m
      max-clients: 100
    credentials:
      enabled: true
      verification-secret: 01234567890123456789012345678901
      verification-web-origin: https://app.test
      terms-version: TERMS_V1
      privacy-notice-version: PRIVACY_V1
      mail-from: no-reply@app.test
      claim-ttl: 30m
      pending-retention: 24h
      resend-cooldown: 60s
      identifier-requests: 20
      identifier-window: 5m
      max-identifiers: 100
      delivery-retry-base: 1s
      delivery-max-attempts: 3
      dispatch-interval: 1h
      cleanup-interval: 1h
    session-maintenance:
      cleanup-interval: 1h
      retention: 30d
  speech:
    enabled: true
    timeout: 1s
    max-clips-per-publish: 200
