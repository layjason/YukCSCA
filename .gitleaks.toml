# Gitleaks configuration for YukCSCA.
# Extends the default rule set. Allow entries must stay narrow and document why
# the value is provably public; credentials are never allowlisted.
#
# NOTE: gitleaks 8.24.x (the version pinned by .github/workflows/security.yml)
# parses only the legacy [allowlist] table with plural keys; the newer
# [[allowlists]] array form and singular regex/path keys are silently ignored.
#
# No allowlist entries are currently needed: the Microsoft Edge read-aloud
# trusted-client token constant was retired together with the Edge TTS adapter
# in VS-010B (ADR-0003 moved all speech synthesis to gTTS, whose pinned wire
# protocol carries no token or credential).

title = "yukcsca-gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Microsoft Edge read-aloud TTS trusted client token: a published protocol constant in historical commits, identical for every caller and shipped with open-source edge-tts (https://github.com/rany2/edge-tts). Retired with the Edge TTS adapter in VS-010B (ADR-0003)."
regexTarget = "match"
regexes = ['''6A5AA1D4EAFF4E9FB37E23D68491D6F4''']
stopwords = [
  "6A5AA1D4EAFF4E9FB37E23D68491D6F4"
]
commits = [
  "7b67e84f277d551aae7e18abced58f21d67e1cb5"
]
