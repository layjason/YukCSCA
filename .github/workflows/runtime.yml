name: Runtime validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.14.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @yukcsca/web exec playwright install --with-deps chromium
      - run: pnpm e2e:web
      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  containers:
    name: containers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOOGLE_CLIENT_ID: ci-google-client-id.apps.googleusercontent.com
      VITE_GOOGLE_CLIENT_ID: ci-google-client-id.apps.googleusercontent.com
      YUKCSCA_JWT_SECRET: ci-only-secret-at-least-thirty-two-bytes-long
      YUKCSCA_COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - run: docker compose config --quiet
      - run: docker compose --project-name yukcsca-runtime build web api render-worker
      - run: docker compose --project-name yukcsca-runtime up --detach --no-build --wait --wait-timeout 180
      - run: ./scripts/smoke.sh
      - name: Show container logs on failure
        if: failure()
        run: docker compose --project-name yukcsca-runtime logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose --project-name yukcsca-runtime down --volumes --remove-orphans
