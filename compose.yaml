name: yukcsca

services:
  mailpit:
    image: axllent/mailpit:v1.30.4@sha256:5a49a77c5bdbe7c5474450b4f46348d09949df3695257729c93a30369382d4f6
    ports:
      - '${MAILPIT_UI_PORT:-8025}:8025'
      - '${SMTP_PORT:-1025}:1025'
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider --quiet http://127.0.0.1:8025/readyz']
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yukcsca}
      POSTGRES_USER: ${POSTGRES_USER:-yukcsca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yukcsca-local}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18+ stores versioned PGDATA below this parent directory.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  # VS-010B: S3-compatible object storage for reviewed-video/caption bytes (D-02).
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${YUKCSCA_MEDIA_ACCESS_KEY:-yukcsca-local}
      MINIO_ROOT_PASSWORD: ${YUKCSCA_MEDIA_SECRET_KEY:-yukcsca-local-secret}
      # CR-06: browser presigned PUT from the web origin (preflight + PUT). Playback
      # itself does not need bucket CORS; CSP media-src is the frontend deployment gate.
      MINIO_API_CORS_ALLOW_ORIGIN: ${YUKCSCA_WEB_ORIGIN:-http://localhost:5173}
    ports:
      - '${MINIO_PORT:-9000}:9000'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # VS-010B: isolated render worker (pinned Manim + manim-voiceover gTTS + FFmpeg)
  # polling the PostgreSQL render-job queue. Executes no authored scene code.
  render-worker:
    build:
      context: ./services/render-worker
      dockerfile: Dockerfile
    environment:
      WORKER_DB_DSN: postgresql://${POSTGRES_USER:-yukcsca}:${POSTGRES_PASSWORD:-yukcsca-local}@postgres:5432/${POSTGRES_DB:-yukcsca}
      WORKER_S3_ENDPOINT: http://minio:9000
      WORKER_S3_BUCKET: ${YUKCSCA_MEDIA_BUCKET:-yukcsca-media}
      WORKER_S3_ACCESS_KEY: ${YUKCSCA_MEDIA_ACCESS_KEY:-yukcsca-local}
      WORKER_S3_SECRET_KEY: ${YUKCSCA_MEDIA_SECRET_KEY:-yukcsca-local-secret}
      WORKER_S3_AUTO_CREATE_BUCKET: 'true'
      WORKER_MAX_ATTEMPTS: '3'
      # Must exceed the 900s render hard-timeout plus child shutdown grace.
      WORKER_VISIBILITY_TIMEOUT_SECONDS: '1020'
      WORKER_RENDER_TIMEOUT_SECONDS: '900'
      WORKER_POLL_INTERVAL_SECONDS: '5'
    depends_on:
      # Flyway owns render_job creation; wait for API readiness on a clean database.
      api:
        condition: service_healthy
      minio:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2g
          pids: 256
    develop:
      watch:
        - action: rebuild
          path: ./services/render-worker
          ignore:
            - tests/
            - .pytest_cache/
            - __pycache__/

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-yukcsca}
      DB_USERNAME: ${POSTGRES_USER:-yukcsca}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-yukcsca-local}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      YUKCSCA_JWT_SECRET: ${YUKCSCA_JWT_SECRET}
      YUKCSCA_AUTH_ISSUER: ${YUKCSCA_AUTH_ISSUER:-http://localhost:8080}
      YUKCSCA_WEB_ORIGIN: ${YUKCSCA_WEB_ORIGIN:-http://localhost:5173}
      YUKCSCA_COOKIE_SECURE: ${YUKCSCA_COOKIE_SECURE:-false}
      YUKCSCA_COOKIE_SAME_SITE: ${YUKCSCA_COOKIE_SAME_SITE:-Lax}
      YUKCSCA_FIRST_ADMIN_EMAIL: ${YUKCSCA_FIRST_ADMIN_EMAIL:-}
      YUKCSCA_CREDENTIAL_AUTH_ENABLED: ${YUKCSCA_CREDENTIAL_AUTH_ENABLED:-true}
      YUKCSCA_VERIFICATION_SECRET: ${YUKCSCA_VERIFICATION_SECRET:-local-verification-secret-32-bytes-minimum}
      YUKCSCA_VERIFICATION_WEB_ORIGIN: ${YUKCSCA_VERIFICATION_WEB_ORIGIN:-http://localhost:5173}
      YUKCSCA_TERMS_VERSION: ${YUKCSCA_TERMS_VERSION:-TERMS_V1}
      YUKCSCA_PRIVACY_NOTICE_VERSION: ${YUKCSCA_PRIVACY_NOTICE_VERSION:-PRIVACY_V1}
      YUKCSCA_VERIFICATION_MAIL_FROM: ${YUKCSCA_VERIFICATION_MAIL_FROM:-no-reply@yukcsca.local}
      YUKCSCA_SPEECH_ENABLED: ${YUKCSCA_SPEECH_ENABLED:-false}
      YUKCSCA_SPEECH_TIMEOUT: ${YUKCSCA_SPEECH_TIMEOUT:-8s}
      # The API client uses the Compose service name; presigned URLs returned to the host browser
      # use the separately configured public origin.
      YUKCSCA_MEDIA_ENDPOINT: http://minio:9000
      YUKCSCA_MEDIA_PUBLIC_ENDPOINT: ${YUKCSCA_MEDIA_PUBLIC_ENDPOINT:-http://localhost:9000}
      YUKCSCA_MEDIA_BUCKET: ${YUKCSCA_MEDIA_BUCKET:-yukcsca-media}
      YUKCSCA_MEDIA_ACCESS_KEY: ${YUKCSCA_MEDIA_ACCESS_KEY:-yukcsca-local}
      YUKCSCA_MEDIA_SECRET_KEY: ${YUKCSCA_MEDIA_SECRET_KEY:-yukcsca-local-secret}
      YUKCSCA_MEDIA_AUTO_CREATE_BUCKET: 'true'
      YUKCSCA_SPEECH_MAX_CLIPS_PER_PUBLISH: ${YUKCSCA_SPEECH_MAX_CLIPS_PER_PUBLISH:-200}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - '${API_PORT:-8080}:8080'
    depends_on:
      mailpit:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:8080/actuator/health/readiness']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    develop:
      watch:
        - action: rebuild
          path: ./services/api
          ignore:
            - target/

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    ports:
      - '${WEB_PORT:-5173}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1/']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    develop:
      watch:
        - action: rebuild
          path: ./apps/web
          ignore:
            - dist/
            - node_modules/
            - playwright-report/
            - test-results/
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./pnpm-workspace.yaml

volumes:
  postgres-data:
  minio-data:
