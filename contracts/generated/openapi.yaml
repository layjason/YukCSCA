tags: []
paths:
  /api/v1/admin/academic-images:
    post:
      operationId: AcademicAdminApi_uploadAcademicImage
      description: Uploads one bounded PNG or JPEG diagram with its minimal source basis.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              required: true
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicAdmin.AcademicImage'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AcademicAdmin.AcademicValidationProblem'
        '401':
          description: Access is unauthorized.
          headers:
            WWW-Authenticate:
              required: false
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcademicAdmin.UploadAcademicImageRequest'
            encoding:
              file:
                contentType: image/png, image/jpeg
              provenance:
                contentType: application/json
      security:
        - BearerAuth: []
  /api/v1/admin/academic-images/{id}:
    get:
      operationId: AcademicAdminApi_getAcademicImage
      description: Returns one immutable, administrator-only academic image.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - private, max-age=31536000, immutable
            X-Content-Type-Options:
              required: true
              schema:
                type: string
                enum:
                  - nosniff
          content:
            image/png:
              schema:
                contentMediaType: image/png
            image/jpeg:
              schema:
                contentMediaType: image/jpeg
        '401':
          description: Access is unauthorized.
          headers:
            WWW-Authenticate:
              required: false
              schema:
                type: string
          content:
            application/problem+json:
