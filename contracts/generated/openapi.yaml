        reason:
          type: string
          minLength: 1
          maxLength: 500
    AcademicAdmin.ContentBlock:
      anyOf:
        - $ref: '#/components/schemas/AcademicAdmin.TextContentBlock'
        - $ref: '#/components/schemas/AcademicAdmin.MathContentBlock'
        - $ref: '#/components/schemas/AcademicAdmin.ImageContentBlock'
    AcademicAdmin.ContentOrigin:
      type: string
      enum:
        - YUKCSCA_ORIGINAL
        - LICENSED
        - OPEN_LICENSE
