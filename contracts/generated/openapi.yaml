              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profile.ActivateStudentProfileRequest'
      security:
        - BearerAuth: []
  /api/v1/student-profile/me:
    get:
      operationId: StudentProfileApi_getMyStudentProfile
      description: Returns the authenticated student's own profile.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              required: true
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile.StudentProfile'
        '401':
          description: Access is unauthorized.
          headers:
            WWW-Authenticate:
              required: false
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        - BearerAuth: []
    patch:
      operationId: StudentProfileApi_updateMyStudentProfile
      description: Partially updates the authenticated student's own profile. Omitted fields remain unchanged. Birth year remains bounded profile data and is not legal-age verification. Explanation language remains independent from interface and exam language.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              required: true
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile.StudentProfile'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Profile.ValidationProblem'
        '401':
          description: Access is unauthorized.
          headers:
            WWW-Authenticate:
              required: false
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profile.UpdateMyStudentProfileRequest'
      security:
        - BearerAuth: []
components:
  schemas:
    AcademicAdmin.AcademicImage:
      type: object
      required:
        - id
        - mediaType
        - byteSize
        - width
        - height
        - sha256
        - provenance
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        mediaType:
          type: string
          enum:
            - image/png
            - image/jpeg
        byteSize:
          type: integer
          format: int64
          minimum: 1
          maximum: 5242880
        width:
          type: integer
          format: int32
          minimum: 1
          maximum: 4096
        height:
          type: integer
          format: int32
          minimum: 1
          maximum: 4096
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        provenance:
          $ref: '#/components/schemas/AcademicAdmin.ProvenanceRecord'
        createdAt:
          type: string
          format: date-time
    AcademicAdmin.AcademicPackage:
      type: object
      required:
        - id
        - subject
        - status
        - draftRevision
        - activeRevision
        - hasUnpublishedChanges
        - draft
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        subject:
          $ref: '#/components/schemas/AcademicAdmin.AcademicSubject'
        status:
          $ref: '#/components/schemas/AcademicAdmin.AcademicPackageStatus'
        draftRevision:
          type: integer
          format: int64
        activeRevision:
          anyOf:
            - $ref: '#/components/schemas/AcademicAdmin.PublishedRevisionSummary'
            - type: 'null'
        hasUnpublishedChanges:
          type: boolean
          description: True when the saved draft differs from the active published revision; false after a successful publication.
        draft:
          $ref: '#/components/schemas/AcademicAdmin.AcademicPackageDraft'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AcademicAdmin.AcademicPackageDraft:
      type: object
      required:
        - officialSyllabus
        - outlineItems
        - learningObjectives
        - resources
        - questions
        - mocks
      properties:
        officialSyllabus:
          $ref: '#/components/schemas/AcademicAdmin.OfficialSyllabus'
        outlineItems:
          type: array
          items:
            $ref: '#/components/schemas/AcademicAdmin.SyllabusOutlineItem'
        learningObjectives:
          type: array
          items:
            $ref: '#/components/schemas/AcademicAdmin.LearningObjective'
        resources:
          type: array
          items:
            type: object
            required:
              - id
              - title
              - outlineItemIds
              - objectiveIds
              - versions
              - provenance
            properties:
              id:
                $ref: '#/components/schemas/uuid'
              kind:
                $ref: '#/components/schemas/AcademicAdmin.StudyResourceKind'
              title:
                $ref: '#/components/schemas/AcademicAdmin.LocalizedText'
              outlineItemIds:
                type: array
                items:
                  $ref: '#/components/schemas/uuid'
              objectiveIds:
                type: array
                items:
                  $ref: '#/components/schemas/uuid'
              versions:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicAdmin.LocalizedContent'
              provenance:
                $ref: '#/components/schemas/AcademicAdmin.DraftProvenanceRecord'
        questions:
          type: array
          items:
            type: object
            required:
              - id
              - stem
              - options
              - explanations
              - outlineItemIds
              - objectiveIds
              - provenance
            properties:
              id:
                $ref: '#/components/schemas/uuid'
              examLanguage:
                $ref: '#/components/schemas/AcademicAdmin.ExamLanguage'
              difficulty:
                $ref: '#/components/schemas/AcademicAdmin.QuestionDifficulty'
              stem:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicAdmin.ContentBlock'
              options:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicAdmin.QuestionOption'
              correctOptionKey:
                type: string
                minLength: 1
                maxLength: 40
              explanations:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicAdmin.LocalizedContent'
              outlineItemIds:
                type: array
                items:
                  $ref: '#/components/schemas/uuid'
              objectiveIds:
                type: array
                items:
                  $ref: '#/components/schemas/uuid'
              provenance:
                $ref: '#/components/schemas/AcademicAdmin.DraftProvenanceRecord'
        mocks:
          type: array
          items:
            $ref: '#/components/schemas/AcademicAdmin.MockPaperRecord'
          maxItems: 1
    AcademicAdmin.AcademicPackageDraftInput:
      type: object
      required:
        - officialSyllabus
        - outlineItems
        - learningObjectives
        - resources
        - questions
        - mocks
      properties:
        officialSyllabus:
          $ref: '#/components/schemas/AcademicAdmin.OfficialSyllabus'
        outlineItems:
          type: array
          items:
            $ref: '#/components/schemas/AcademicAdmin.SyllabusOutlineItem'
        learningObjectives:
          type: array
          items:
            $ref: '#/components/schemas/AcademicAdmin.LearningObjective'
        resources:
          type: array
          items:
            type: object
            required:
              - id
              - title
              - outlineItemIds
              - objectiveIds
              - versions
              - provenance
            properties:
              id:
                $ref: '#/components/schemas/uuid'
              kind:
                $ref: '#/components/schemas/AcademicAdmin.StudyResourceKind'
              title:
                $ref: '#/components/schemas/AcademicAdmin.LocalizedText'
              outlineItemIds:
                type: array
                items:
                  $ref: '#/components/schemas/uuid'
              objectiveIds:
                type: array
                items:
                  $ref: '#/components/schemas/uuid'
              versions:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicAdmin.LocalizedContent'
              provenance:
                $ref: '#/components/schemas/AcademicAdmin.DraftProvenanceInput'
        questions:
          type: array
          items:
            type: object
            required:
              - id
              - stem
              - options
              - explanations
              - outlineItemIds
              - objectiveIds
              - provenance
            properties:
              id:
                $ref: '#/components/schemas/uuid'
              examLanguage:
                $ref: '#/components/schemas/AcademicAdmin.ExamLanguage'
              difficulty:
                $ref: '#/components/schemas/AcademicAdmin.QuestionDifficulty'
              stem:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicAdmin.ContentBlock'
              options:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicAdmin.QuestionOption'
              correctOptionKey:
                type: string
                minLength: 1
                maxLength: 40
              explanations:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicAdmin.LocalizedContent'
              outlineItemIds:
                type: array
                items:
                  $ref: '#/components/schemas/uuid'
              objectiveIds:
                type: array
                items:
                  $ref: '#/components/schemas/uuid'
              provenance:
                $ref: '#/components/schemas/AcademicAdmin.DraftProvenanceInput'
        mocks:
          type: array
          items:
            $ref: '#/components/schemas/AcademicAdmin.MockPaper'
          maxItems: 1
    AcademicAdmin.AcademicPackageStatus:
      type: string
      enum:
        - DRAFT
        - PUBLISHED
        - ARCHIVED
    AcademicAdmin.AcademicPackageSummary:
      type: object
      required:
        - id
        - subject
        - status
        - draftRevision
        - activeRevision
        - hasUnpublishedChanges
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        subject:
          $ref: '#/components/schemas/AcademicAdmin.AcademicSubject'
        status:
          $ref: '#/components/schemas/AcademicAdmin.AcademicPackageStatus'
        draftRevision:
          type: integer
          format: int64
        activeRevision:
          anyOf:
            - $ref: '#/components/schemas/AcademicAdmin.PublishedRevisionSummary'
            - type: 'null'
        hasUnpublishedChanges:
          type: boolean
          description: True when the package has saved draft changes that are not in the active published revision.
        updatedAt:
          type: string
          format: date-time
    AcademicAdmin.AcademicSubject:
      type: string
      enum:
        - MATHEMATICS
      description: 'CSCA preparation subject. Additive: new subjects extend this enum without changing package lifecycle.'
    AcademicAdmin.AcademicValidationCode:
      type: string
      enum:
        - REQUIRED
        - INVALID
        - UNSUPPORTED
        - OUT_OF_RANGE
        - DUPLICATE
        - INCOMPATIBLE
        - MISSING_PERMISSION
        - STALE_REVISION
    AcademicAdmin.AcademicValidationProblem:
      type: object
      required:
        - code
        - violations
      properties:
        code:
          type: string
          enum:
            - ACADEMIC_VALIDATION_FAILED
        violations:
          type: array
          items:
