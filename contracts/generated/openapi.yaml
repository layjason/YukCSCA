            - $ref: '#/components/schemas/uuid'
            - type: 'null'
          description: 'For RENDER_SCENE: the produced asset once SUCCEEDED. For VALIDATE_UPLOAD: the confirmed asset under validation, set when the job is created.'
        attempts:
          type: integer
          format: int32
          minimum: 0
          maximum: 5
        error:
          anyOf:
            - $ref: '#/components/schemas/AcademicAdmin.RenderJobError'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      description: "One asynchronous render or upload-validation job. A job snapshots the scene specification and its registry version at enqueue; replacing the specification does not affect an in-flight job — clients detect a stale render by comparing createdAt with the specification's updatedAt. Workers claim through a visibility-timeout poll; a claim that expires without completion is retried within the attempts bound and then fails terminally. Suggested client poll interval: 5 seconds."
    AcademicAdmin.RenderJobConflictProblem:
      type: object
      required:
        - code
        - job
      properties:
        code:
          type: string
          enum:
            - RENDER_JOB_ACTIVE
        job:
          $ref: '#/components/schemas/AcademicAdmin.RenderJob'
      allOf:
        - $ref: '#/components/schemas/Problem'
      description: One active job already exists for this scene specification. The embedded job recovers the job id after a lost response without any listing.
    AcademicAdmin.RenderJobError:
      type: object
      required:
        - code
      properties:
        code:
          $ref: '#/components/schemas/AcademicAdmin.RenderJobErrorCode'
        detail:
          anyOf:
            - type: string
            - type: 'null'
          maxLength: 500
      description: Terminal job failure detail. Never carries narration text or scene content.
    AcademicAdmin.RenderJobErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - RENDER_TIMEOUT
        - DURATION_POLICY
        - SPEECH_SYNTHESIS_FAILED
        - INTERNAL
      description: Terminal failure classification surfaced to the administrator.
    AcademicAdmin.RenderJobKind:
      type: string
      enum:
        - VALIDATE_UPLOAD
        - RENDER_SCENE
      description: Asynchronous job kind executed by the isolated Python render worker on the PostgreSQL-polled queue.
    AcademicAdmin.RenderJobState:
      type: string
      enum:
        - QUEUED
        - RUNNING
        - SUCCEEDED
        - FAILED
      description: Render/validation job state. SUCCEEDED and FAILED are terminal; retries stay inside RUNNING attempts.
    AcademicAdmin.ResourceVideoAttachment:
      type: object
      required:
        - language
      properties:
        language:
          $ref: '#/components/schemas/AcademicAdmin.ExplanationLanguage'
        videoAssetId:
          anyOf:
            - $ref: '#/components/schemas/uuid'
            - type: 'null'
        sceneSpecificationId:
          anyOf:
            - $ref: '#/components/schemas/uuid'
            - type: 'null'
      description: 'Optional reviewed-video attachment on one explanation-language version of a study resource; the durable draft handle that survives reloads. Upload path: videoAssetId is set at slot confirmation and kept through AWAITING_VALIDATION and later states. Production path: sceneSpecificationId is set at script creation and retained through review so the script stays reopenable (transcript from segments, replace, re-enqueue); videoAssetId is added when the render job reaches SUCCEEDED. At least one of the two ids must be present; both are present on the produced path after success. videoAssetId is the sole publish/projection reference. Drafts are saved immediately after each id is obtained, so recovery after reload needs only the package draft.'
    AcademicAdmin.SaveAcademicPackageDraftRequest:
      type: object
      required:
        - expectedDraftRevision
        - draft
      properties:
        expectedDraftRevision:
          type: integer
          format: int64
          minimum: 0
        draft:
          $ref: '#/components/schemas/AcademicAdmin.AcademicPackageDraftInput'
    AcademicAdmin.SceneSegment:
      type: object
      required:
        - templateActionId
        - narrationText
      properties:
        templateActionId:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,63}$
        params:
          description: 'Template-specific parameters: an arbitrary JSON object, carried as an untyped wire boundary because its shape is per-template. Clients author it from the SceneTemplateAction param descriptors and narrow it immediately; the server semantically validates keys and values against the reviewed template schema, surfacing violations with the offending segment path.'
        narrationText:
          type: string
          minLength: 1
          maxLength: 600
      description: 'One template-bound scene segment authored in the admin script: a reviewed visual action plus its narration text. Never executable scene code.'
    AcademicAdmin.SceneSpecification:
      type: object
      required:
        - id
        - registryVersion
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        registryVersion:
          type: string
          minLength: 1
          maxLength: 40
          description: Registry version this specification was last validated against. A registry bump that invalidates an old script surfaces as VALIDATION_FAILED at render; the editor warns before re-render by comparing with the current registry version.
        latestRenderJob:
          anyOf:
            - $ref: '#/components/schemas/AcademicAdmin.RenderJob'
            - type: 'null'
          description: Latest render job for this specification, embedded on responses so reload recovery needs no job listing. Null when never enqueued.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      allOf:
        - $ref: '#/components/schemas/AcademicAdmin.SceneSpecificationInput'
      description: Stored admin script compiled to a template-bound scene specification. The render worker consumes only this schema-validated data.
    AcademicAdmin.SceneSpecificationInput:
      type: object
      required:
        - explanationLanguage
        - segments
      properties:
        explanationLanguage:
          $ref: '#/components/schemas/AcademicAdmin.ExplanationLanguage'
        segments:
          type: array
          items:
            $ref: '#/components/schemas/AcademicAdmin.SceneSegment'
          minItems: 1
          maxItems: 60
    AcademicAdmin.SceneTemplateAction:
      type: object
      required:
        - id
        - displayName
        - params
      properties:
        id:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,63}$
        displayName:
          type: string
          minLength: 1
          maxLength: 80
          description: Canonical authoring name; server-provided registry metadata in one canonical language for the pilot, not student-facing content. Clients may layer localization by action id later.
        params:
          type: array
          items:
            $ref: '#/components/schemas/AcademicAdmin.SceneTemplateParamDescriptor'
          maxItems: 16
          description: Structured parameter descriptors the script editor renders inputs from. Empty when the action takes no parameters.
      description: One reviewed visual action available to the admin script editor.
    AcademicAdmin.SceneTemplateParamChoice:
      type: string
      pattern: ^[A-Z0-9][A-Z0-9_]{0,63}$
      description: One closed choice token of an ENUM-kind template parameter; uppercase alphanumeric/underscore identifier.
    AcademicAdmin.SceneTemplateParamDescriptor:
      type: object
      required:
        - id
        - kind
      properties:
        id:
          type: string
          pattern: ^[a-z][a-zA-Z0-9]{0,63}$
          description: CamelCase identifier (e.g. xMin, keyPoints), matching SceneTemplateParamVisibility.paramId; template-action ids are the kebab-case identifiers.
        kind:
          $ref: '#/components/schemas/AcademicAdmin.SceneTemplateParamKind'
        label:
          anyOf:
            - type: string
            - type: 'null'
          minLength: 1
          maxLength: 160
          description: Canonical authoring label; server-provided registry metadata in one canonical language for the pilot, not student-facing content. Clients may layer localization by action and param id later.
        required:
          anyOf:
            - type: boolean
            - type: 'null'
        min:
          anyOf:
            - type: number
              format: decimal
            - type: 'null'
          description: Inclusive lower bound; INTEGER and DECIMAL kinds only (ENUM uses choices instead).
        max:
          anyOf:
            - type: number
              format: decimal
            - type: 'null'
          description: Inclusive upper bound; INTEGER and DECIMAL kinds only (ENUM uses choices instead).
        maxLength:
          anyOf:
            - type: integer
              format: int32
            - type: 'null'
          minimum: 1
          maximum: 2000
          description: Maximum text length; STRING, MULTILINE_TEXT, and MATH_EXPRESSION kinds only.
        choices:
          anyOf:
            - type: array
              items:
                $ref: '#/components/schemas/AcademicAdmin.SceneTemplateParamChoice'
            - type: 'null'
          minItems: 1
          maxItems: 16
          description: Closed choice tokens for ENUM kind only; ignored otherwise.
        visibleWhen:
          anyOf:
            - $ref: '#/components/schemas/AcademicAdmin.SceneTemplateParamVisibility'
            - type: 'null'
          description: Optional display rule; see SceneTemplateParamVisibility.
      description: Data-only descriptor of one template-action parameter. Bounded values; never executable content.
    AcademicAdmin.SceneTemplateParamKind:
      type: string
      enum:
        - STRING
        - MULTILINE_TEXT
        - INTEGER
        - DECIMAL
        - MATH_EXPRESSION
        - ENUM
        - INTERVAL_SET
      description: Input kind of one template-action parameter; drives the structured control the script editor renders. Semantic validation stays server-side against the same reviewed schema.
    AcademicAdmin.SceneTemplateParamVisibility:
      type: object
      required:
        - paramId
        - choices
      properties:
        paramId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z][a-zA-Z0-9]{0,63}$
          description: Id of the observed ENUM parameter.
        choices:
          type: array
          items:
            $ref: '#/components/schemas/AcademicAdmin.SceneTemplateParamChoice'
          minItems: 1
          maxItems: 16
          description: Choice tokens of the observed parameter that make the owning parameter applicable.
      description: 'Data-only display rule: the owning parameter is collected only while the referenced ENUM-kind parameter holds one of the listed choice tokens. Presentation-only — server-side validation semantics are unchanged; an absent rule means always shown.'
    AcademicAdmin.SceneTemplateRegistry:
      type: object
      required:
        - version
        - actions
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 40
        actions:
          type: array
          items:
            $ref: '#/components/schemas/AcademicAdmin.SceneTemplateAction'
          minItems: 1
      description: Current reviewed render-template registry versioned with the worker.
    AcademicAdmin.SourcePosition:
      type: object
      properties:
        page:
          anyOf:
            - type: integer
              format: int32
            - type: 'null'
        section:
          anyOf:
            - type: string
            - type: 'null'
          maxLength: 160
    AcademicAdmin.StudyResourceKind:
      type: string
      enum:
        - LESSON
        - TERMINOLOGY
        - REMEDIATION
    AcademicAdmin.SyllabusOutlineItem:
      type: object
      required:
        - id
        - parentId
        - order
        - summary
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        parentId:
          anyOf:
            - $ref: '#/components/schemas/uuid'
            - type: 'null'
        order:
          type: integer
          format: int32
          minimum: 0
        sourcePosition:
          $ref: '#/components/schemas/AcademicAdmin.SourcePosition'
        summary:
          $ref: '#/components/schemas/AcademicAdmin.LocalizedText'
    AcademicAdmin.TermClass:
      type: string
      enum:
        - EXAM_INSTRUCTION
        - LOGICAL_EXPRESSION
        - TOPIC_TERM
      description: Exam-language role of a reviewed term. Not a syllabus topic and not a subject. Algebra/calculus/physics live on outline bindings and the package subject.
    AcademicAdmin.TermDraft:
      type: object
      required:
        - id
        - termClass
        - surfaceForms
        - definitions
        - englishEquivalent
        - outlineItemIds
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        termClass:
          $ref: '#/components/schemas/AcademicAdmin.TermClass'
        surfaceForms:
          type: array
          items:
            $ref: '#/components/schemas/AcademicAdmin.TermSurfaceFormInput'
          minItems: 1
          maxItems: 8
        definitions:
          $ref: '#/components/schemas/AcademicAdmin.LocalizedText'
          description: Explanation-language glosses. May include the same \(...\) inline KaTeX as TEXT blocks. Missing languages are allowed and must be flagged to students; they do not fork identity.
        englishEquivalent:
          type: string
          minLength: 1
          maxLength: 200
          description: Short English equivalent. May include \(...\) inline KaTeX.
        symbols:
          anyOf:
            - type: string
            - type: 'null'
          maxLength: 80
          description: Optional notation as bounded KaTeX (no \(...\) wrappers). Raw HTML and arbitrary macros are not supported.
        example:
          anyOf:
            - type: string
            - type: 'null'
          maxLength: 500
          description: Optional authentic example. May include the same \(...\) inline KaTeX as TEXT blocks.
        outlineItemIds:
          type: array
          items:
            $ref: '#/components/schemas/uuid'
          maxItems: 32
          description: TOPIC_TERM should bind at least one outline item at publish. Exam-wording classes may be empty and reused across topics.
      description: Package-scoped reviewed term identity. Same model for any Chinese exam-language subject package.
    AcademicAdmin.TermSurfaceFormInput:
      type: object
      required:
        - text
        - pinyin
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 40
        pinyin:
          type: string
          minLength: 1
          maxLength: 80
      description: One Chinese surface form of a reviewed term. Audio is rendered at publish, not authored here.
    AcademicAdmin.TextContentBlock:
      type: object
      required:
        - kind
        - text
      properties:
        kind:
          type: string
          enum:
            - TEXT
        text:
          type: string
          minLength: 1
          maxLength: 12000
          description: Prose that may include bounded inline KaTeX between \(...\). Display-mode formulas stay MATH blocks. Terminology span offsets are UTF-16 code units into this source string, including delimiters, and must not overlap inline math. Raw HTML and arbitrary macros are not supported.
    AcademicAdmin.TopicMapping:
      type: object
      required:
        - outlineItemId
      properties:
        outlineItemId:
          $ref: '#/components/schemas/uuid'
        rationale:
          type: string
          minLength: 1
          maxLength: 500
    AcademicAdmin.UploadAcademicImageRequest:
      type: object
      properties:
        file: {}
        provenance:
          $ref: '#/components/schemas/AcademicAdmin.ProvenanceInput'
      required:
        - file
        - provenance
    AcademicAdmin.VideoAssetSource:
      type: string
      enum:
        - UPLOADED
        - PRODUCED
      description: How a reviewed-video asset came to exist.
    AcademicAdmin.VideoAssetStatus:
      type: string
      enum:
        - AWAITING_VALIDATION
        - DRAFT
        - REVIEWED
        - REJECTED
        - RETIRED
      description: Lifecycle of an optional reviewed-video asset. UPLOADED assets are created at slot confirmation in AWAITING_VALIDATION; PRODUCED assets are created by a succeeded render directly in DRAFT (a failed render creates no asset — the failure lives on the render job). Only REVIEWED assets project into a published revision; students never observe any other state. RETIRED is system-managed when a replacement publishes.
    AcademicAdmin.VideoPlaybackGrant:
      type: object
      required:
        - url
        - expiresAt
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 2000
        expiresAt:
          type: string
          format: date-time
      description: Short-lived presigned playback grant. The client assigns url to a video element src, so native Range streaming and resume go straight to object storage with no credentials attached; deployment must therefore allow the storage origin in CSP media-src. Grants are never cached and are refreshed from this API before expiresAt.
    AcademicAdmin.VideoUploadSlot:
      type: object
      required:
        - id
        - explanationLanguage
        - uploadUrl
        - maxByteSize
        - expiresAt
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        explanationLanguage:
          $ref: '#/components/schemas/AcademicAdmin.ExplanationLanguage'
        uploadUrl:
          type: string
          minLength: 1
          maxLength: 2000
        maxByteSize:
          type: integer
          format: int64
          minimum: 1
          maximum: 209715200
          description: Upload size bound for the pre-upload client check; server-side probing enforces the same bound.
        expiresAt:
          type: string
          format: date-time
      description: Short-lived presigned slot for direct-to-storage upload of one finished short video. uploadUrl accepts exactly one HTTP PUT whose body is the raw video bytes; send no Content-Type or other headers beyond those covered by the presign. The storage bucket must allow the web origin for the presigned PUT (CORS preflight plus exposed ETag) — a deployment invariant of this slice.
    AcademicAdmin.VideoValidationRetryConflictProblem:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - RENDER_JOB_ACTIVE
            - VALIDATION_NOT_RETRYABLE
        job:
          anyOf:
            - $ref: '#/components/schemas/AcademicAdmin.RenderJob'
            - type: 'null'
      allOf:
        - $ref: '#/components/schemas/Problem'
      description: Validation retry conflict. RENDER_JOB_ACTIVE embeds the already-active validation job; VALIDATION_NOT_RETRYABLE means the asset is not an uploaded asset awaiting validation or its staged bytes are no longer reserved.
    AcademicStudent.BookmarkLessonTermsRequest:
      type: object
      required:
        - explanationLanguage
      properties:
        explanationLanguage:
          $ref: '#/components/schemas/AcademicAdmin.ExplanationLanguage'
        termIds:
          type: array
          items:
            $ref: '#/components/schemas/uuid'
          maxItems: 64
          description: Subset of this lesson's required term ids. Omit or empty to bookmark the whole lesson list.
      description: Bookmarks this lesson's required list (or a subset). Ids not on the lesson are rejected. Formal-mock sessions receive 403.
    AcademicStudent.BookmarkLessonTermsResult:
      type: object
      required:
        - termIds
      properties:
        termIds:
          type: array
          items:
            $ref: '#/components/schemas/uuid'
          maxItems: 64
    AcademicStudent.BookmarkTermRequest:
      type: object
      required:
        - subject
        - explanationLanguage
        - source
      properties:
        subject:
          $ref: '#/components/schemas/AcademicAdmin.AcademicSubject'
        explanationLanguage:
          $ref: '#/components/schemas/AcademicAdmin.ExplanationLanguage'
        source:
          $ref: '#/components/schemas/AcademicStudent.TermLookupSource'
        resourceId:
          $ref: '#/components/schemas/uuid'
          description: Required when source is LESSON or PREVIEW. For PREVIEW this is the LESSON id.
        sessionId:
          $ref: '#/components/schemas/uuid'
          description: Required when source is ITEM.
        itemId:
          $ref: '#/components/schemas/uuid'
          description: Required when source is ITEM.
      description: Opt-in bookmark of one reviewed term. Validates the same source/resource rules as lookup. Formal-mock sessions receive 403.
    AcademicStudent.BookmarkTermResult:
      type: object
      required:
        - card
        - alreadyInNotebook
        - entry
      properties:
        card:
          $ref: '#/components/schemas/AcademicStudent.TermCard'
        alreadyInNotebook:
          type: boolean
          enum:
            - true
        entry:
          $ref: '#/components/schemas/AcademicStudent.NotebookEntry'
    AcademicStudent.ClozeReviewPrompt:
      type: object
      required:
        - kind
        - snippet
        - options
      properties:
        kind:
          type: string
          enum:
            - CONTEXT_CLOZE
        snippet:
          type: string
          minLength: 1
          maxLength: 400
          description: Short published fragment with the target replaced by a placeholder. Never a full item, answer key, or student response.
        options:
          type: array
          items:
            $ref: '#/components/schemas/AcademicStudent.ReviewOption'
          minItems: 2
          maxItems: 6
    AcademicStudent.ContentProgress:
      type: object
      required:
        - status
        - resumeBlockIndex
        - updatedAt
        - updatedSinceCompleted
      properties:
        status:
          $ref: '#/components/schemas/AcademicStudent.ContentProgressStatus'
        resumeBlockIndex:
          anyOf:
            - type: integer
              format: int32
            - type: 'null'
          minimum: 0
          description: Zero-based resume index into the blocks of the explanation-language version the student was reading. Null when not started or when no block position is recorded.
        video:
          anyOf:
            - $ref: '#/components/schemas/AcademicStudent.VideoPlaybackPosition'
            - type: 'null'
          description: "Last saved reviewed-video playback position on this resource. Null when no position was saved; restored positions are clamped to the currently published asset's duration. One position per resource (pilot behavior): watching in a different explanation language overwrites it. Watching is never mastery evidence."
        updatedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          description: Last progress write time. Null when status is NOT_STARTED.
        updatedSinceCompleted:
          type: boolean
          description: True when status is CONTENT_COMPLETE and this study resource's student-visible content (title, outline/objective links, language versions, blocks) differs between the package revision recorded when the student last marked complete and the active published revision. Unrelated package changes (edition labels, other lessons, assessment questions) do not set this flag. Soft signal only; never demotes content complete or implies mastery.
      description: Per-student content progress on one LESSON or REMEDIATION resource. Absent storage projects as NOT_STARTED.
    AcademicStudent.ContentProgressStatus:
      type: string
      enum:
        - NOT_STARTED
        - IN_PROGRESS
        - CONTENT_COMPLETE
      description: Persisted or projected content-progress status. Content complete is never mastery.
    AcademicStudent.ContentProgressValidationProblem:
      type: object
      required:
        - code
        - violations
      properties:
        code:
          type: string
          enum:
            - CONTENT_PROGRESS_VALIDATION_FAILED
        violations:
          type: array
          items:
            $ref: '#/components/schemas/AcademicStudent.ContentProgressValidationViolation'
      allOf:
        - $ref: '#/components/schemas/Problem'
    AcademicStudent.ContentProgressValidationViolation:
      type: object
      required:
        - path
        - code
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 200
        code:
          type: string
          minLength: 1
          maxLength: 80
    AcademicStudent.LessonBody:
      anyOf:
        - $ref: '#/components/schemas/AcademicStudent.LessonContentAvailable'
        - $ref: '#/components/schemas/AcademicStudent.LessonLanguageUnavailable'
    AcademicStudent.LessonContentAvailable:
      type: object
      required:
        - availability
        - blocks
      properties:
        availability:
          type: string
          enum:
            - AVAILABLE
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/AcademicAdmin.ContentBlock'
      description: Ordered LESSON body for one explanation language.
    AcademicStudent.LessonLanguageUnavailable:
      type: object
      required:
        - availability
        - requestedLanguage
      properties:
        availability:
          type: string
          enum:
            - LANGUAGE_UNAVAILABLE
        requestedLanguage:
          $ref: '#/components/schemas/AcademicAdmin.ExplanationLanguage'
      description: Requested explanation language has no authored version. Clients must not silently substitute another language.
    AcademicStudent.LessonSummary:
      type: object
      required:
        - resourceId
        - title
        - outlineItemIds
        - contentProgress
      properties:
        resourceId:
          $ref: '#/components/schemas/uuid'
        title:
          $ref: '#/components/schemas/AcademicAdmin.LocalizedText'
        outlineItemIds:
          type: array
          items:
            $ref: '#/components/schemas/uuid'
          minItems: 0
        contentProgress:
          $ref: '#/components/schemas/AcademicStudent.ContentProgress'
        terminologyPreview:
          anyOf:
            - $ref: '#/components/schemas/AcademicStudent.TerminologyPreviewRef'
            - type: 'null'
          description: This lesson's terminology preview when the LESSON has a non-empty required term list. resourceId is the LESSON id. Null or omitted when this lesson has no required terms. Several lessons may share one outline node; each lesson only surfaces its own list.
      description: LESSON summary for outline browse and continue chips. Kind is always LESSON; other resource kinds are omitted.
    AcademicStudent.LessonTerminology:
      type: object
      required:
        - previewResourceId
        - rail
        - spans
      properties:
        previewResourceId:
          anyOf:
            - $ref: '#/components/schemas/uuid'
            - type: 'null'
          description: This LESSON id when the lesson has a required term list; otherwise null. Preview is per lesson, not a shared outline TERMINOLOGY resource.
        rail:
          type: array
          items:
            $ref: '#/components/schemas/AcademicStudent.TermCard'
          maxItems: 64
          description: Required terms bound on this lesson, in preview order.
        spans:
          type: array
          items:
            $ref: '#/components/schemas/AcademicStudent.TermSpan'
          maxItems: 200
          description: Required and instruction/logic surface forms that occur in TEXT blocks of the requested lesson body.
      description: Lesson rail and tappable spans. Absent from the lesson when the package has no published Chinese terms.
    AcademicStudent.MatchPairsReviewPrompt:
      type: object
      required:
        - kind
        - promptSurface
        - options
      properties:
        kind:
          type: string
          enum:
            - MATCH_PAIRS
        promptSurface:
          type: string
          minLength: 1
          maxLength: 40
        options:
          type: array
          items:
            $ref: '#/components/schemas/AcademicStudent.ReviewOption'
          minItems: 2
          maxItems: 6
    AcademicStudent.NotebookEntry:
      type: object
      required:
        - termId
        - subject
        - packageId
        - termClass
        - primarySurface
        - familiarity
        - due
        - lastReviewAt
        - sources
        - metIn
        - pendingReview
      properties:
        termId:
          $ref: '#/components/schemas/uuid'
        subject:
          $ref: '#/components/schemas/AcademicAdmin.AcademicSubject'
        packageId:
          $ref: '#/components/schemas/uuid'
        termClass:
          $ref: '#/components/schemas/AcademicAdmin.TermClass'
        primarySurface:
          $ref: '#/components/schemas/AcademicStudent.TermSurfaceForm'
        familiarity:
          $ref: '#/components/schemas/AcademicStudent.TermFamiliarity'
        due:
          type: boolean
        lastReviewAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
