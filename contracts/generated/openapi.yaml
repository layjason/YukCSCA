          type: array
          items:
            $ref: '#/components/schemas/AssessmentStudent.MistakeSummary'
        nextCursor:
          anyOf:
            - type: string
            - type: 'null'
          description: Opaque cursor for the next page; null when no further items.
    AssessmentStudent.MistakeStatus:
      type: string
      enum:
        - OPEN
        - REMEDIATION_IN_PROGRESS
        - AWAITING_REVALIDATION
        - REVALIDATION_PASSED
      description: Mistake notebook lifecycle for one student + package + question.
    AssessmentStudent.MistakeSummary:
      type: object
      required:
        - mistakeId
        - status
        - subject
        - packageId
        - questionId
        - examLanguage
        - errorCause
        - stemPreview
        - errorCount
        - assistanceSummary
        - revalidationEligible
        - lastSessionId
        - updatedAt
      properties:
        mistakeId:
          $ref: '#/components/schemas/uuid'
        status:
          $ref: '#/components/schemas/AssessmentStudent.MistakeStatus'
        subject:
          $ref: '#/components/schemas/AcademicAdmin.AcademicSubject'
        packageId:
          $ref: '#/components/schemas/uuid'
        questionId:
          $ref: '#/components/schemas/uuid'
        examLanguage:
          $ref: '#/components/schemas/AcademicAdmin.ExamLanguage'
        errorCause:
          anyOf:
            - $ref: '#/components/schemas/AssessmentStudent.ErrorCause'
            - type: 'null'
        stemPreview:
          type: array
          items:
            $ref: '#/components/schemas/AcademicAdmin.ContentBlock'
          maxItems: 3
          description: Prefix of the immutable attempt stem for list identification (server may truncate block count). Exact full stem is on MistakeDetail.attemptQuestion.
        errorCount:
          type: integer
          format: int32
          minimum: 1
        assistanceSummary:
          $ref: '#/components/schemas/AssessmentStudent.AssistanceSummary'
        revalidationEligible:
          type: boolean
        lastSessionId:
          anyOf:
            - $ref: '#/components/schemas/uuid'
            - type: 'null'
        updatedAt:
          type: string
          format: date-time
      description: Mistake list row. Includes list-safe stem preview from the attempt copy; omits private note.
    AssessmentStudent.RelatedResourceRef:
      type: object
      required:
        - resourceId
        - kind
        - title
      properties:
        resourceId:
          $ref: '#/components/schemas/uuid'
        kind:
          type: string
          enum:
            - LESSON
            - REMEDIATION
          description: Student-openable kinds only. TERMINOLOGY is omitted from this projection in VS-009.
        title:
          $ref: '#/components/schemas/AcademicAdmin.LocalizedText'
      description: Navigable published study resource reference for post-submit solution links (LESSON or REMEDIATION). Resolved from admin relatedResourceIds.
    AssessmentStudent.RemediationCandidate:
      type: object
      required:
        - resourceId
        - kind
        - title
        - preferred
      properties:
        resourceId:
          $ref: '#/components/schemas/uuid'
        kind:
          $ref: '#/components/schemas/AcademicAdmin.StudyResourceKind'
        title:
          $ref: '#/components/schemas/AcademicAdmin.LocalizedText'
        preferred:
          type: boolean
      description: Published remediation or lesson candidate for a mistake fail path.
    AssessmentStudent.SessionItemOption:
      type: object
      required:
        - key
        - blocks
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 40
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/AcademicAdmin.ContentBlock'
          minItems: 1
      description: Student-safe option projection (no correctness flag).
    AssessmentStudent.SessionItemView:
      type: object
      required:
        - itemId
        - order
        - questionId
        - status
        - stem
        - options
        - hintTierCount
        - disclosedTierCount
        - hintLadder
        - disclosedHints
        - strongAssistance
        - selectedOptionKey
        - correct
        - feedback
        - outlineItemIds
        - objectiveIds
        - languageHelpAvailable
      properties:
        itemId:
          $ref: '#/components/schemas/uuid'
        order:
          type: integer
          format: int32
          minimum: 0
        questionId:
          $ref: '#/components/schemas/uuid'
        status:
          $ref: '#/components/schemas/AssessmentStudent.ItemAttemptStatus'
        stem:
          type: array
          items:
            $ref: '#/components/schemas/AcademicAdmin.ContentBlock'
        options:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentStudent.SessionItemOption'
        hintTierCount:
          type: integer
          format: int32
          minimum: 0
          maximum: 8
        disclosedTierCount:
          type: integer
          format: int32
          minimum: 0
          maximum: 8
        hintLadder:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentStudent.HintTierMeta'
          maxItems: 8
          description: Full ordered ladder metadata (strength + disclosed flag) without bodies. Length equals hintTierCount.
        disclosedHints:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentStudent.DisclosedHintTier'
          description: Bodies only for tiers already disclosed in this session.
        strongAssistance:
          type: boolean
        selectedOptionKey:
          anyOf:
            - type: string
            - type: 'null'
          description: Selected option when the student has answered. Null when not yet answered.
        correct:
          anyOf:
            - type: boolean
            - type: 'null'
          description: Present only when the item is locked and feedback mode allows revelation (IMMEDIATE after lock, or after SET_END submit).
        feedback:
          anyOf:
            - $ref: '#/components/schemas/AssessmentStudent.ItemFeedback'
            - type: 'null'
          description: Present only when feedback is revealed for this item.
        outlineItemIds:
          type: array
          items:
            $ref: '#/components/schemas/uuid'
          maxItems: 32
        objectiveIds:
          type: array
          items:
            $ref: '#/components/schemas/uuid'
          maxItems: 32
        languageHelpAvailable:
          type: boolean
          description: 'True when Language help may be disclosed on this item: zh-CN exam-language item, published term bank on the package, and the session is not formal-disabled. False for English-only items, packages with no published terms, and reserved formal-mock. First paint uses this flag only; do not infer from examLanguage and do not probe disclose. Chips stay in languageHelp after disclose.'
        languageHelp:
          anyOf:
            - $ref: '#/components/schemas/AssessmentStudent.LanguageHelpView'
            - type: 'null'
          description: Present only after the student discloses Language help on this item. Null or omitted on first paint so the stem stays clean.
      description: One session item. Pre-submit payloads omit correct keys and undisclosed hint bodies; hintLadder exposes strength metadata only; languageHelpAvailable is first-paint Language-help chrome metadata.
    AssessmentStudent.SessionResult:
      type: object
      required:
        - sessionId
        - status
        - purpose
        - correctCount
        - total
        - strongAssistanceUsed
        - checkpointPassed
        - mistakeIds
        - evidenceWritten
        - items
        - context
        - submittedAt
      properties:
        sessionId:
          $ref: '#/components/schemas/uuid'
        status:
          type: string
          enum:
            - SUBMITTED
        purpose:
          $ref: '#/components/schemas/AssessmentStudent.AssessmentSessionPurpose'
        correctCount:
          type: integer
          format: int32
          minimum: 0
        total:
          type: integer
          format: int32
          minimum: 1
        strongAssistanceUsed:
          type: boolean
        checkpointPassed:
          anyOf:
            - type: boolean
            - type: 'null'
        mistakeIds:
          type: array
          items:
            $ref: '#/components/schemas/uuid'
          maxItems: 12
        evidenceWritten:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentStudent.LearningEvidenceSnapshot'
          description: Objective evidence written on this submit when checkpoint passed; empty otherwise.
        items:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentStudent.SessionItemView'
        context:
          $ref: '#/components/schemas/AssessmentStudent.AssessmentContextSummary'
        submittedAt:
          type: string
          format: date-time
      description: Final scored session result. checkpointPassed is non-null only for CHECKPOINT purpose.
    AssessmentStudent.StartAssessmentSessionRequest:
      type: object
      required:
        - purpose
        - subject
        - setId
        - examLanguage
      properties:
        purpose:
          $ref: '#/components/schemas/AcademicAdmin.AssessmentSetPurpose'
        subject:
          $ref: '#/components/schemas/AcademicAdmin.AcademicSubject'
        setId:
          $ref: '#/components/schemas/uuid'
        examLanguage:
          $ref: '#/components/schemas/AcademicAdmin.ExamLanguage'
        planTaskId:
          anyOf:
            - $ref: '#/components/schemas/uuid'
            - type: 'null'
          description: Reserved for plan-assigned practice (VS-017). Must be null or omitted in VS-009.
      description: Start CHECKPOINT or TOPIC_PRACTICE. REVALIDATION uses startRevalidation.
    AssessmentStudent.SubmitItemAnswerRequest:
      type: object
      required:
        - selectedOptionKey
      properties:
        selectedOptionKey:
          type: string
          minLength: 1
          maxLength: 40
    AssessmentStudent.UpdateMistakeAnnotationRequest:
      type: object
      properties:
        errorCause:
          anyOf:
            - $ref: '#/components/schemas/AssessmentStudent.ErrorCause'
            - type: 'null'
          description: Omit to leave unchanged; null clears.
        privateNote:
          anyOf:
            - type: string
            - type: 'null'
          maxLength: 2000
          description: Omit to leave unchanged; null clears.
    Auth.AuthResponse:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresInSeconds
        - user
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
            - Bearer
        expiresInSeconds:
          type: integer
          format: int64
        user:
          $ref: '#/components/schemas/Auth.CurrentUser'
    Auth.CompleteCredentialVerificationRequest:
      type: object
      required:
        - token
        - password
        - termsVersion
        - privacyNoticeVersion
        - termsAccepted
        - privacyNoticeAcknowledged
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 512
        password:
          type: string
          minLength: 15
          maxLength: 128
        termsVersion:
          type: string
          minLength: 1
          maxLength: 100
        privacyNoticeVersion:
          type: string
          minLength: 1
          maxLength: 100
        termsAccepted:
          type: boolean
          enum:
            - true
        privacyNoticeAcknowledged:
          type: boolean
          enum:
            - true
    Auth.CompletePasswordRecoveryRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 512
        password:
          type: string
          minLength: 15
          maxLength: 128
    Auth.CredentialLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          maxLength: 320
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 128
    Auth.CredentialVerificationOutcome:
      type: string
      enum:
        - CREDENTIAL_ACCOUNT_CREATED
        - SIGN_IN_WITH_GOOGLE
    Auth.CredentialVerificationResult:
      type: object
      required:
        - outcome
      properties:
        outcome:
          $ref: '#/components/schemas/Auth.CredentialVerificationOutcome'
    Auth.CurrentUser:
      type: object
      required:
        - id
        - email
        - displayName
        - role
        - onboardingCompleted
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        email:
          type: string
        displayName:
          anyOf:
            - type: string
            - type: 'null'
        avatarUrl:
          anyOf:
            - type: string
            - type: 'null'
        role:
          $ref: '#/components/schemas/Auth.UserRole'
        onboardingCompleted:
          type: boolean
    Auth.GoogleLoginRequest:
      type: object
      required:
        - credential
      properties:
        credential:
          type: string
          minLength: 20
          maxLength: 10000
      description: A browser credential returned by Google Identity Services.
    Auth.PasswordRecoveryRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          maxLength: 320
          format: email
    Auth.ResendCredentialVerificationRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          maxLength: 320
          format: email
    Auth.StartCredentialRegistrationRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          maxLength: 320
          format: email
    Auth.UserRole:
      type: string
      enum:
        - UNASSIGNED
        - STUDENT
        - PARENT
        - TUTOR
        - ADMIN
    FormalAssistanceDisabledProblem:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - FORMAL_ASSISTANCE_DISABLED
      allOf:
        - $ref: '#/components/schemas/Problem'
      description: Reserved deny when a formal timed mock is active. Language help and notebook writes stay off.
    Problem:
      type: object
      required:
        - status
        - title
        - code
      properties:
        status:
          type: integer
          format: int32
        type:
          type: string
        title:
          type: string
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
    Profile.ActivateStudentProfileRequest:
      type: object
      required:
        - preferredName
        - birthYear
        - currentGrade
        - city
        - defaultExplanationLanguage
      properties:
        preferredName:
          type: string
          minLength: 1
          maxLength: 160
          description: The student's explicitly confirmed preferred name. Provider profile data is only an editable suggestion.
        birthYear:
          type: integer
          format: int32
          description: A birth year in the inclusive range from the current Asia/Jakarta year minus 21 through the current year minus 12.
        currentGrade:
          $ref: '#/components/schemas/Profile.StudentGrade'
        city:
          type: string
          minLength: 1
          maxLength: 120
        defaultExplanationLanguage:
          $ref: '#/components/schemas/Profile.ExplanationLanguage'
    Profile.ExplanationLanguage:
      type: string
      enum:
        - id
        - en
        - zh-CN
    Profile.FieldViolation:
      type: object
      required:
        - field
        - code
      properties:
        field:
          $ref: '#/components/schemas/Profile.StudentActivationField'
        code:
          $ref: '#/components/schemas/Profile.FieldViolationCode'
    Profile.FieldViolationCode:
      type: string
      enum:
        - REQUIRED
        - TOO_LONG
        - OUT_OF_RANGE
        - UNSUPPORTED
    Profile.StudentActivationField:
      type: string
      enum:
        - preferredName
        - birthYear
        - currentGrade
        - city
        - defaultExplanationLanguage
    Profile.StudentActivationResult:
      type: object
      required:
        - profile
        - authentication
      properties:
        profile:
          $ref: '#/components/schemas/Profile.StudentProfile'
        authentication:
          $ref: '#/components/schemas/Auth.AuthResponse'
    Profile.StudentGrade:
      type: string
      enum:
        - GRADE_10
        - GRADE_11
        - GRADE_12
        - OTHER
    Profile.StudentProfile:
      type: object
      required:
        - id
        - preferredName
        - birthYear
        - currentGrade
        - city
        - defaultExplanationLanguage
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        preferredName:
          type: string
        birthYear:
          type: integer
          format: int32
        currentGrade:
          $ref: '#/components/schemas/Profile.StudentGrade'
        city:
          type: string
        defaultExplanationLanguage:
          $ref: '#/components/schemas/Profile.ExplanationLanguage'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Profile.UpdateMyStudentProfileRequest:
      type: object
      properties:
        preferredName:
          type: string
          minLength: 1
          maxLength: 160
        birthYear:
          type: integer
          format: int32
          description: A corrected birth year in the inclusive range from the current Asia/Jakarta year minus 21 through the current year minus 12. It is not legal-age verification.
        currentGrade:
          $ref: '#/components/schemas/Profile.StudentGrade'
        city:
          type: string
          minLength: 1
          maxLength: 120
        defaultExplanationLanguage:
          $ref: '#/components/schemas/Profile.ExplanationLanguage'
          description: Changes explanatory content defaults only; it does not change interface or exam language.
      description: A partial update to the authenticated student's own profile. Omitted fields remain unchanged; an empty or identical update is a successful no-op.
    Profile.ValidationProblem:
      type: object
      required:
        - code
        - violations
      properties:
        code:
          type: string
          enum:
            - VALIDATION_FAILED
        violations:
          type: array
          items:
            $ref: '#/components/schemas/Profile.FieldViolation'
      allOf:
        - $ref: '#/components/schemas/Problem'
    uuid:
      type: string
      format: uuid
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
