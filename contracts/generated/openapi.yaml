        reviewedByUserId:
          anyOf:
            - $ref: '#/components/schemas/uuid'
            - type: 'null'
        reviewedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
      allOf:
        - $ref: '#/components/schemas/AcademicAdmin.DraftProvenanceInput'
    AcademicAdmin.ExamLanguage:
      type: string
      enum:
        - en
        - zh-CN
    AcademicAdmin.ExamStructure:
      type: object
      properties:
        durationMinutes:
