          type: string
          minLength: 32
          maxLength: 512
        password:
          type: string
          minLength: 15
          maxLength: 128
        termsVersion:
          type: string
          minLength: 1
          maxLength: 100
        privacyNoticeVersion:
          type: string
          minLength: 1
          maxLength: 100
        termsAccepted:
          type: boolean
          enum:
            - true
        privacyNoticeAcknowledged:
          type: boolean
          enum:
            - true
    Auth.CompletePasswordRecoveryRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 512
        password:
          type: string
          minLength: 15
          maxLength: 128
    Auth.CredentialLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          maxLength: 320
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 128
    Auth.CredentialVerificationOutcome:
      type: string
      enum:
        - CREDENTIAL_ACCOUNT_CREATED
        - SIGN_IN_WITH_GOOGLE
    Auth.CredentialVerificationResult:
      type: object
      required:
        - outcome
      properties:
        outcome:
          $ref: '#/components/schemas/Auth.CredentialVerificationOutcome'
    Auth.CurrentUser:
      type: object
      required:
        - id
        - email
        - displayName
        - role
        - onboardingCompleted
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        email:
          type: string
        displayName:
          anyOf:
            - type: string
            - type: 'null'
        avatarUrl:
          anyOf:
            - type: string
            - type: 'null'
        role:
          $ref: '#/components/schemas/Auth.UserRole'
        onboardingCompleted:
          type: boolean
    Auth.GoogleLoginRequest:
      type: object
      required:
        - credential
      properties:
        credential:
          type: string
          minLength: 20
          maxLength: 10000
      description: A browser credential returned by Google Identity Services.
    Auth.PasswordRecoveryRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          maxLength: 320
          format: email
    Auth.ResendCredentialVerificationRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          maxLength: 320
          format: email
    Auth.StartCredentialRegistrationRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          maxLength: 320
          format: email
    Auth.UserRole:
      type: string
      enum:
        - UNASSIGNED
        - STUDENT
        - PARENT
        - TUTOR
        - ADMIN
    Problem:
      type: object
      required:
        - status
        - title
        - code
      properties:
        status:
          type: integer
          format: int32
        type:
          type: string
        title:
          type: string
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
    Profile.ActivateStudentProfileRequest:
      type: object
      required:
        - preferredName
        - birthYear
        - currentGrade
        - city
        - defaultExplanationLanguage
      properties:
        preferredName:
          type: string
          minLength: 1
          maxLength: 160
          description: The student's explicitly confirmed preferred name. Provider profile data is only an editable suggestion.
        birthYear:
          type: integer
          format: int32
          description: A birth year in the inclusive range from the current Asia/Jakarta year minus 21 through the current year minus 12.
        currentGrade:
          $ref: '#/components/schemas/Profile.StudentGrade'
        city:
          type: string
          minLength: 1
          maxLength: 120
        defaultExplanationLanguage:
          $ref: '#/components/schemas/Profile.ExplanationLanguage'
    Profile.ExplanationLanguage:
      type: string
      enum:
        - id
        - en
        - zh-CN
    Profile.FieldViolation:
      type: object
      required:
        - field
        - code
      properties:
        field:
          $ref: '#/components/schemas/Profile.StudentActivationField'
        code:
          $ref: '#/components/schemas/Profile.FieldViolationCode'
    Profile.FieldViolationCode:
      type: string
      enum:
        - REQUIRED
        - TOO_LONG
        - OUT_OF_RANGE
        - UNSUPPORTED
    Profile.StudentActivationField:
      type: string
      enum:
        - preferredName
        - birthYear
        - currentGrade
        - city
        - defaultExplanationLanguage
    Profile.StudentActivationResult:
      type: object
      required:
        - profile
        - authentication
      properties:
        profile:
          $ref: '#/components/schemas/Profile.StudentProfile'
        authentication:
          $ref: '#/components/schemas/Auth.AuthResponse'
    Profile.StudentGrade:
      type: string
      enum:
        - GRADE_10
        - GRADE_11
        - GRADE_12
        - OTHER
    Profile.StudentProfile:
      type: object
      required:
        - id
        - preferredName
        - birthYear
        - currentGrade
        - city
        - defaultExplanationLanguage
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        preferredName:
          type: string
        birthYear:
          type: integer
          format: int32
        currentGrade:
          $ref: '#/components/schemas/Profile.StudentGrade'
        city:
          type: string
        defaultExplanationLanguage:
          $ref: '#/components/schemas/Profile.ExplanationLanguage'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Profile.UpdateMyStudentProfileRequest:
      type: object
      properties:
        preferredName:
          type: string
          minLength: 1
          maxLength: 160
        birthYear:
          type: integer
          format: int32
          description: A corrected birth year in the inclusive range from the current Asia/Jakarta year minus 21 through the current year minus 12. It is not legal-age verification.
        currentGrade:
          $ref: '#/components/schemas/Profile.StudentGrade'
        city:
          type: string
          minLength: 1
          maxLength: 120
        defaultExplanationLanguage:
          $ref: '#/components/schemas/Profile.ExplanationLanguage'
          description: Changes explanatory content defaults only; it does not change interface or exam language.
      description: A partial update to the authenticated student's own profile. Omitted fields remain unchanged; an empty or identical update is a successful no-op.
    Profile.ValidationProblem:
      type: object
      required:
        - code
        - violations
      properties:
        code:
          type: string
          enum:
            - VALIDATION_FAILED
        violations:
          type: array
          items:
            $ref: '#/components/schemas/Profile.FieldViolation'
      allOf:
        - $ref: '#/components/schemas/Problem'
    uuid:
      type: string
      format: uuid
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
