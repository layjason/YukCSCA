  /api/v1/academic/terminology-notebook:
    get:
      operationId: AcademicStudentApi_listTerminologyNotebook
      description: Lists the authenticated student's terminology notebook. One list; Due and class group are filters, not separate homes. Optional subject filter keeps later Chinese Physics/Chemistry on the same resource.
      parameters:
        - name: explanationLanguage
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/AcademicAdmin.ExplanationLanguage'
          explode: false
        - name: dueOnly
          in: query
          required: false
          schema:
            type: boolean
          explode: false
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
          explode: false
        - name: classGroup
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AcademicStudent.TermClassGroup'
          explode: false
        - name: subject
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AcademicAdmin.AcademicSubject'
          explode: false
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              required: true
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicStudent.NotebookListResponseBody'
        '400':
