        indonesian:
          type: string
          minLength: 1
          maxLength: 4000
        english:
          type: string
          minLength: 1
          maxLength: 4000
        simplifiedChinese:
          type: string
          minLength: 1
          maxLength: 4000
    AcademicAdmin.MathContentBlock:
      type: object
      required:
        - kind
        - latex
        - displayMode
      properties:
        kind:
          type: string
          enum:
            - MATH
        latex:
          type: string
          minLength: 1
          maxLength: 4000
