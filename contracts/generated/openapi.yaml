          format: int32
          minimum: 1
          maximum: 300
        totalPoints:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
        questionCount:
          type: integer
          format: int32
          minimum: 1
          maximum: 200
        questionType:
          type: string
          enum:
            - SINGLE_ANSWER
        examLanguages:
          type: array
          items:
            $ref: '#/components/schemas/AcademicAdmin.ExamLanguage'
          maxItems: 2
      description: Timed exam shape for a subject package. Values are package-owned; publication requires mock and structure to match.
    AcademicAdmin.ExplanationLanguage:
      type: string
      enum:
        - id
        - en
        - zh-CN
    AcademicAdmin.ImageContentBlock:
      type: object
      required:
        - kind
        - imageId
        - altText
        - caption
      properties:
        kind:
          type: string
          enum:
            - IMAGE
        imageId:
          $ref: '#/components/schemas/uuid'
        altText:
          type: string
          minLength: 1
          maxLength: 500
        caption:
          anyOf:
            - type: string
            - type: 'null'
          maxLength: 1000
    AcademicAdmin.LearningObjective:
      type: object
      required:
        - id
        - title
        - mappings
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        title:
          $ref: '#/components/schemas/AcademicAdmin.LocalizedText'
        mappings:
          type: array
          items:
            $ref: '#/components/schemas/AcademicAdmin.TopicMapping'
    AcademicAdmin.LocalizedContent:
      type: object
      required:
        - language
        - blocks
      properties:
        language:
          $ref: '#/components/schemas/AcademicAdmin.ExplanationLanguage'
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/AcademicAdmin.ContentBlock'
    AcademicAdmin.LocalizedText:
      type: object
