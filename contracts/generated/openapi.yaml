    AcademicStudent.TermCard:
      type: object
      required:
        - termId
        - subject
        - packageId
        - termClass
        - alreadyInNotebook
        - primarySurface
        - aliases
        - definition
        - englishEquivalent
        - symbols
        - example
        - outlineItemIds
      properties:
        termId:
          $ref: '#/components/schemas/uuid'
        subject:
          $ref: '#/components/schemas/AcademicAdmin.AcademicSubject'
        packageId:
          $ref: '#/components/schemas/uuid'
        termClass:
          $ref: '#/components/schemas/AcademicAdmin.TermClass'
