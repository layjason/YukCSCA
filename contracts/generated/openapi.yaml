components:
  schemas:
    AcademicAdmin.AcademicImage:
      type: object
      required:
        - id
        - mediaType
        - byteSize
        - width
        - height
        - sha256
        - provenance
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        mediaType:
          type: string
          enum:
            - image/png
            - image/jpeg
        byteSize:
          type: integer
          format: int64
          minimum: 1
          maximum: 5242880
        width:
          type: integer
          format: int32
          minimum: 1
          maximum: 4096
        height:
          type: integer
          format: int32
          minimum: 1
          maximum: 4096
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        provenance:
          $ref: '#/components/schemas/AcademicAdmin.ProvenanceRecord'
        createdAt:
          type: string
          format: date-time
    AcademicAdmin.AcademicPackage:
      type: object
      required:
        - id
        - subject
        - status
        - draftRevision
        - activeRevision
        - hasUnpublishedChanges
        - draft
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        subject:
          $ref: '#/components/schemas/AcademicAdmin.AcademicSubject'
        status:
          $ref: '#/components/schemas/AcademicAdmin.AcademicPackageStatus'
        draftRevision:
          type: integer
          format: int64
        activeRevision:
          anyOf:
            - $ref: '#/components/schemas/AcademicAdmin.PublishedRevisionSummary'
            - type: 'null'
        hasUnpublishedChanges:
          type: boolean
          description: True when the saved draft differs from the active published revision; false after a successful publication.
        draft:
          $ref: '#/components/schemas/AcademicAdmin.AcademicPackageDraft'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AcademicAdmin.AcademicPackageDraft:
      type: object
      required:
        - officialSyllabus
        - outlineItems
        - learningObjectives
        - resources
        - questions
        - mocks
      properties:
        officialSyllabus:
          $ref: '#/components/schemas/AcademicAdmin.OfficialSyllabus'
        outlineItems:
          type: array
          items:
            $ref: '#/components/schemas/AcademicAdmin.SyllabusOutlineItem'
        learningObjectives:
          type: array
          items:
            $ref: '#/components/schemas/AcademicAdmin.LearningObjective'
        resources:
          type: array
          items:
            type: object
            required:
              - id
              - title
              - outlineItemIds
              - objectiveIds
              - versions
              - provenance
            properties:
              id:
                $ref: '#/components/schemas/uuid'
              kind:
                $ref: '#/components/schemas/AcademicAdmin.StudyResourceKind'
              title:
                $ref: '#/components/schemas/AcademicAdmin.LocalizedText'
              outlineItemIds:
                type: array
                items:
                  $ref: '#/components/schemas/uuid'
              objectiveIds:
                type: array
                items:
                  $ref: '#/components/schemas/uuid'
              versions:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicAdmin.LocalizedContent'
              provenance:
                $ref: '#/components/schemas/AcademicAdmin.DraftProvenanceRecord'
              requiredTermIds:
                type: array
                items:
                  $ref: '#/components/schemas/uuid'
                maxItems: 64
                description: Ordered required term ids for this resource. On LESSON this is that lesson's preview list (not a shared outline dictionary). TERMINOLOGY may still carry ids in older drafts; student preview and the lesson rail use the LESSON list. Empty or omitted for REMEDIATION.
              videos:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicAdmin.ResourceVideoAttachment'
                maxItems: 3
                description: Optional reviewed short-video attachments, at most one per explanation language. Projected only on LESSON and REMEDIATION kinds; a TERMINOLOGY draft carrying an attachment is rejected by application validation, and an attachment with both videoAssetId and sceneSpecificationId absent is rejected as an incomplete handle. The attachment language must equal the referenced asset's explanationLanguage and, on the production path, the scene specification's explanationLanguage; mismatches are draft-save validation violations (INCOMPATIBLE) on resources[i].videos[j].language. Only assets in REVIEWED status at publish time project into the published revision; attachments referencing other states are excluded without blocking publication of the complete text, formula, and image unit. Each replacement references a new asset id and records its own provenance.
        questions:
          type: array
          items:
            type: object
            required:
              - id
              - stem
              - options
              - explanations
              - outlineItemIds
              - objectiveIds
              - provenance
            properties:
              id:
                $ref: '#/components/schemas/uuid'
              examLanguage:
                $ref: '#/components/schemas/AcademicAdmin.ExamLanguage'
              difficulty:
                $ref: '#/components/schemas/AcademicAdmin.QuestionDifficulty'
              stem:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicAdmin.ContentBlock'
              options:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicAdmin.QuestionOption'
              correctOptionKey:
                type: string
                minLength: 1
                maxLength: 40
              explanations:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicAdmin.LocalizedContent'
              hintTiers:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicAdmin.HintTier'
                maxItems: 8
                description: Ordered mathematical hint ladder. Empty when no hints are authored. Chinese language-assist tiers are out of VS-009.
              commonMistakeNotes:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicAdmin.LocalizedText'
                maxItems: 6
                description: Optional short common-mistake notes shown after item feedback. Not a full remediation resource.
              relatedResourceIds:
                type: array
                items:
                  $ref: '#/components/schemas/uuid'
                maxItems: 8
                description: Optional LESSON or REMEDIATION resource ids linked from post-submit solution UI.
              authoredTermAttachments:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicAdmin.AuthoredTermAttachment'
                maxItems: 32
                description: Optional admin-preset term attachments. Auto-match of required and instruction/logic surface forms still applies. Do not mark every character.
              outlineItemIds:
                type: array
                items:
                  $ref: '#/components/schemas/uuid'
              objectiveIds:
                type: array
                items:
                  $ref: '#/components/schemas/uuid'
              provenance:
                $ref: '#/components/schemas/AcademicAdmin.DraftProvenanceRecord'
        assessmentSets:
          type: array
          items:
            $ref: '#/components/schemas/AcademicAdmin.AssessmentSet'
          maxItems: 64
          description: Assessment sets saved on the draft. Omitted or empty when none authored; clients should treat omit as empty.
        terms:
          type: array
          items:
            $ref: '#/components/schemas/AcademicAdmin.TermDraft'
          maxItems: 500
          description: Reviewed Chinese exam-language term bank saved on the draft. Omitted or empty when none authored; clients should treat omit as empty.
        mocks:
          type: array
          items:
            $ref: '#/components/schemas/AcademicAdmin.MockPaperRecord'
          maxItems: 1
    AcademicAdmin.AcademicPackageDraftInput:
      type: object
      required:
        - officialSyllabus
        - outlineItems
        - learningObjectives
        - resources
        - questions
        - mocks
      properties:
        officialSyllabus:
          $ref: '#/components/schemas/AcademicAdmin.OfficialSyllabus'
        outlineItems:
          type: array
          items:
            $ref: '#/components/schemas/AcademicAdmin.SyllabusOutlineItem'
        learningObjectives:
          type: array
          items:
            $ref: '#/components/schemas/AcademicAdmin.LearningObjective'
        resources:
          type: array
          items:
            type: object
            required:
              - id
              - title
              - outlineItemIds
              - objectiveIds
              - versions
              - provenance
            properties:
              id:
                $ref: '#/components/schemas/uuid'
              kind:
                $ref: '#/components/schemas/AcademicAdmin.StudyResourceKind'
              title:
                $ref: '#/components/schemas/AcademicAdmin.LocalizedText'
              outlineItemIds:
                type: array
                items:
                  $ref: '#/components/schemas/uuid'
              objectiveIds:
                type: array
                items:
                  $ref: '#/components/schemas/uuid'
              versions:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicAdmin.LocalizedContent'
              provenance:
                $ref: '#/components/schemas/AcademicAdmin.DraftProvenanceInput'
              requiredTermIds:
                type: array
                items:
                  $ref: '#/components/schemas/uuid'
                maxItems: 64
                description: Ordered required term ids for this resource. On LESSON this is that lesson's preview list (not a shared outline dictionary). TERMINOLOGY may still carry ids in older drafts; student preview and the lesson rail use the LESSON list. Empty or omitted for REMEDIATION.
              videos:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicAdmin.ResourceVideoAttachment'
                maxItems: 3
                description: Optional reviewed short-video attachments, at most one per explanation language. Projected only on LESSON and REMEDIATION kinds; a TERMINOLOGY draft carrying an attachment is rejected by application validation, and an attachment with both videoAssetId and sceneSpecificationId absent is rejected as an incomplete handle. The attachment language must equal the referenced asset's explanationLanguage and, on the production path, the scene specification's explanationLanguage; mismatches are draft-save validation violations (INCOMPATIBLE) on resources[i].videos[j].language. Only assets in REVIEWED status at publish time project into the published revision; attachments referencing other states are excluded without blocking publication of the complete text, formula, and image unit. Each replacement references a new asset id and records its own provenance.
        questions:
          type: array
          items:
            type: object
            required:
              - id
              - stem
              - options
              - explanations
              - outlineItemIds
              - objectiveIds
              - provenance
            properties:
              id:
                $ref: '#/components/schemas/uuid'
              examLanguage:
                $ref: '#/components/schemas/AcademicAdmin.ExamLanguage'
              difficulty:
                $ref: '#/components/schemas/AcademicAdmin.QuestionDifficulty'
              stem:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicAdmin.ContentBlock'
              options:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicAdmin.QuestionOption'
              correctOptionKey:
                type: string
                minLength: 1
                maxLength: 40
              explanations:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicAdmin.LocalizedContent'
              hintTiers:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicAdmin.HintTier'
                maxItems: 8
                description: Ordered mathematical hint ladder. Empty when no hints are authored. Chinese language-assist tiers are out of VS-009.
              commonMistakeNotes:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicAdmin.LocalizedText'
                maxItems: 6
                description: Optional short common-mistake notes shown after item feedback. Not a full remediation resource.
              relatedResourceIds:
                type: array
                items:
                  $ref: '#/components/schemas/uuid'
                maxItems: 8
                description: Optional LESSON or REMEDIATION resource ids linked from post-submit solution UI.
              authoredTermAttachments:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicAdmin.AuthoredTermAttachment'
                maxItems: 32
                description: Optional admin-preset term attachments. Auto-match of required and instruction/logic surface forms still applies. Do not mark every character.
              outlineItemIds:
                type: array
                items:
                  $ref: '#/components/schemas/uuid'
              objectiveIds:
                type: array
                items:
                  $ref: '#/components/schemas/uuid'
              provenance:
                $ref: '#/components/schemas/AcademicAdmin.DraftProvenanceInput'
        assessmentSets:
          type: array
          items:
            $ref: '#/components/schemas/AcademicAdmin.AssessmentSet'
          maxItems: 64
          description: Assessment sets (checkpoint and topic practice). Empty array when none authored.
        terms:
          type: array
          items:
            $ref: '#/components/schemas/AcademicAdmin.TermDraft'
          maxItems: 500
          description: Reviewed Chinese exam-language term bank for this package. Subject-agnostic; first published use is Chinese Mathematics. Omitted or empty when none authored.
        mocks:
          type: array
          items:
            $ref: '#/components/schemas/AcademicAdmin.MockPaper'
          maxItems: 1
    AcademicAdmin.AcademicPackageStatus:
      type: string
      enum:
        - DRAFT
        - PUBLISHED
        - ARCHIVED
    AcademicAdmin.AcademicPackageSummary:
      type: object
      required:
        - id
        - subject
        - status
        - draftRevision
        - activeRevision
        - hasUnpublishedChanges
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        subject:
          $ref: '#/components/schemas/AcademicAdmin.AcademicSubject'
        status:
          $ref: '#/components/schemas/AcademicAdmin.AcademicPackageStatus'
        draftRevision:
          type: integer
          format: int64
        activeRevision:
          anyOf:
            - $ref: '#/components/schemas/AcademicAdmin.PublishedRevisionSummary'
            - type: 'null'
        hasUnpublishedChanges:
          type: boolean
          description: True when the package has saved draft changes that are not in the active published revision.
        updatedAt:
          type: string
          format: date-time
    AcademicAdmin.AcademicSubject:
      type: string
      enum:
        - MATHEMATICS
      description: 'CSCA preparation subject. Additive: new subjects extend this enum without changing package lifecycle.'
    AcademicAdmin.AcademicValidationCode:
      type: string
      enum:
        - REQUIRED
        - INVALID
        - UNSUPPORTED
        - OUT_OF_RANGE
        - DUPLICATE
        - INCOMPATIBLE
        - MISSING_PERMISSION
        - STALE_REVISION
    AcademicAdmin.AcademicValidationProblem:
      type: object
      required:
        - code
        - violations
      properties:
        code:
          type: string
          enum:
            - ACADEMIC_VALIDATION_FAILED
        violations:
          type: array
          items:
            $ref: '#/components/schemas/AcademicAdmin.AcademicValidationViolation'
      allOf:
        - $ref: '#/components/schemas/Problem'
    AcademicAdmin.AcademicValidationViolation:
      type: object
      required:
        - path
        - code
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 500
        code:
          $ref: '#/components/schemas/AcademicAdmin.AcademicValidationCode'
    AcademicAdmin.AcademicVideoAsset:
      type: object
      required:
        - id
        - source
        - status
        - explanationLanguage
        - mediaType
        - byteSize
        - durationSeconds
        - width
        - height
        - sha256
        - captionsAvailable
        - rejection
        - latestValidationJob
        - provenance
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        source:
          $ref: '#/components/schemas/AcademicAdmin.VideoAssetSource'
        status:
          $ref: '#/components/schemas/AcademicAdmin.VideoAssetStatus'
        explanationLanguage:
          $ref: '#/components/schemas/AcademicAdmin.ExplanationLanguage'
        mediaType:
          type: string
          enum:
            - video/mp4
        byteSize:
          anyOf:
            - type: integer
              format: int64
            - type: 'null'
          minimum: 1
          maximum: 209715200
          description: Null until bytes are validated.
        durationSeconds:
          anyOf:
            - type: integer
              format: int32
            - type: 'null'
          minimum: 1
          maximum: 600
          description: Null until bytes are validated. Bounded by the short-video duration policy (max 10 minutes).
        width:
          anyOf:
            - type: integer
              format: int32
            - type: 'null'
          minimum: 1
          maximum: 3840
        height:
          anyOf:
            - type: integer
              format: int32
            - type: 'null'
          minimum: 1
          maximum: 2160
        sha256:
          anyOf:
            - type: string
            - type: 'null'
          pattern: ^[a-f0-9]{64}$
        captionsAvailable:
          type: boolean
          description: 'True once WebVTT captions exist: supplied by the admin for UPLOADED assets, derived from narration segments for PRODUCED assets. Required before review.'
        rejection:
          anyOf:
            - type: array
              items:
                $ref: '#/components/schemas/AcademicAdmin.AcademicValidationViolation'
            - type: 'null'
          description: Upload-probe rejection reasons. Null unless status is REJECTED; production failures never create an asset and surface on the render job instead.
        latestValidationJob:
          anyOf:
            - $ref: '#/components/schemas/AcademicAdmin.RenderJob'
            - type: 'null'
          description: Latest VALIDATE_UPLOAD job for an UPLOADED asset, including bounded terminal failure detail so an administrator can recover polling or retry after reload. Null for PRODUCED assets.
        provenance:
          $ref: '#/components/schemas/AcademicAdmin.ProvenanceRecord'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      description: One optional reviewed short-video asset with its lifecycle, playable-shape metadata, and provenance.
    AcademicAdmin.ArchiveAcademicPackageRequest:
      type: object
      required:
        - expectedDraftRevision
        - reason
      properties:
        expectedDraftRevision:
          type: integer
          format: int64
          minimum: 0
        reason:
          type: string
          minLength: 1
          maxLength: 500
    AcademicAdmin.AssessmentFeedbackMode:
      type: string
      enum:
        - IMMEDIATE
        - SET_END
      description: When item correctness and solution content become visible to the student.
    AcademicAdmin.AssessmentSet:
