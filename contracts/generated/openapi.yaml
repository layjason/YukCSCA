      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/AcademicStudent.WritablePreviewProgressStatus'
        expectedPackageRevisionId:
          $ref: '#/components/schemas/uuid'
          description: Optional soft diagnostic of the package revision the client last loaded. Servers may ignore routine republish mismatches.
