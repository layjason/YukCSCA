openapi: 3.1.0
info:
  title: YukCSCA API
  version: 0.1.0
  summary: Contract-first API for YukCSCA
tags: []
paths:
  /api/v1/academic/images/{imageId}:
    get:
      operationId: AcademicStudentApi_getPublishedAcademicImage
      description: Returns image bytes only when the image is referenced by the active published revision of a package the activated student may access.
      parameters:
        - name: imageId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - private, max-age=31536000, immutable
            X-Content-Type-Options:
              required: true
              schema:
                type: string
                enum:
                  - nosniff
          content:
            image/png:
              schema:
                contentMediaType: image/png
            image/jpeg:
              schema:
                contentMediaType: image/jpeg
        '401':
          description: Access is unauthorized.
          headers:
            WWW-Authenticate:
              required: false
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        - BearerAuth: []
  /api/v1/academic/packages:
    get:
      operationId: AcademicStudentApi_listPublishedPackages
      description: Lists published academic packages with an active revision that the activated student may browse under pilot open-access. Subject is never hard-coded to Mathematics.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              required: true
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicStudent.PublishedPackageSummary'
        '401':
          description: Access is unauthorized.
          headers:
            WWW-Authenticate:
              required: false
