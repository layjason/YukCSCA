        url:
          type: string
          minLength: 1
          maxLength: 2000
      description: One admin-maintained official CSCA syllabus PDF locator for a language edition (for example Mathematics EN and zh-CN).
    AcademicAdmin.OfficialSyllabus:
      type: object
      required:
        - subject
