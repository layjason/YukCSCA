            - type: string
            - type: 'null'
          maxLength: 200
        sourceLocator:
          anyOf:
            - type: string
            - type: 'null'
          maxLength: 2000
        permissionReference:
          anyOf:
            - type: string
            - type: 'null'
          maxLength: 1000
    AcademicAdmin.DraftProvenanceRecord:
      type: object
      required:
        - authorUserId
        - reviewedByUserId
        - reviewedAt
      properties:
