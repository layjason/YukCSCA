    AcademicAdmin.AcademicPackageStatus:
      type: string
      enum:
        - DRAFT
        - PUBLISHED
        - ARCHIVED
    AcademicAdmin.AcademicPackageSummary:
      type: object
      required:
        - id
        - subject
        - status
        - draftRevision
        - activeRevision
        - hasUnpublishedChanges
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        subject:
          $ref: '#/components/schemas/AcademicAdmin.AcademicSubject'
        status:
          $ref: '#/components/schemas/AcademicAdmin.AcademicPackageStatus'
        draftRevision:
          type: integer
          format: int64
        activeRevision:
          anyOf:
            - $ref: '#/components/schemas/AcademicAdmin.PublishedRevisionSummary'
            - type: 'null'
        hasUnpublishedChanges:
          type: boolean
          description: True when the package has saved draft changes that are not in the active published revision.
        updatedAt:
          type: string
          format: date-time
    AcademicAdmin.AcademicSubject:
      type: string
      enum:
        - MATHEMATICS
      description: 'CSCA preparation subject. Additive: new subjects extend this enum without changing package lifecycle.'
    AcademicAdmin.AcademicValidationCode:
      type: string
      enum:
        - REQUIRED
        - INVALID
        - UNSUPPORTED
        - OUT_OF_RANGE
        - DUPLICATE
        - INCOMPATIBLE
        - MISSING_PERMISSION
        - STALE_REVISION
    AcademicAdmin.AcademicValidationProblem:
      type: object
      required:
        - code
        - violations
      properties:
        code:
          type: string
          enum:
            - ACADEMIC_VALIDATION_FAILED
        violations:
          type: array
          items:
            $ref: '#/components/schemas/AcademicAdmin.AcademicValidationViolation'
      allOf:
        - $ref: '#/components/schemas/Problem'
    AcademicAdmin.AcademicValidationViolation:
      type: object
      required:
        - path
        - code
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 500
        code:
          $ref: '#/components/schemas/AcademicAdmin.AcademicValidationCode'
    AcademicAdmin.ArchiveAcademicPackageRequest:
      type: object
      required:
        - expectedDraftRevision
        - reason
      properties:
        expectedDraftRevision:
          type: integer
          format: int64
          minimum: 0
        reason:
          type: string
          minLength: 1
          maxLength: 500
    AcademicAdmin.AssessmentFeedbackMode:
      type: string
      enum:
        - IMMEDIATE
        - SET_END
      description: When item correctness and solution content become visible to the student.
    AcademicAdmin.AssessmentSet:
      type: object
      required:
        - id
        - purpose
        - title
        - examLanguage
        - questionIds
        - outlineItemIds
        - objectiveIds
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        purpose:
          $ref: '#/components/schemas/AcademicAdmin.AssessmentSetPurpose'
        title:
          $ref: '#/components/schemas/AcademicAdmin.LocalizedText'
        examLanguage:
          $ref: '#/components/schemas/AcademicAdmin.ExamLanguage'
        difficulty:
          anyOf:
            - $ref: '#/components/schemas/AcademicAdmin.QuestionDifficulty'
            - type: 'null'
          description: Optional difficulty filter tag for TOPIC_PRACTICE catalog queries.
        questionIds:
          type: array
          items:
            $ref: '#/components/schemas/uuid'
          minItems: 1
          maxItems: 12
          description: Ordered question ids. Hard max 12; CHECKPOINT recommended max 5 is soft admin guidance.
        outlineItemIds:
          type: array
          items:
            $ref: '#/components/schemas/uuid'
          maxItems: 32
        objectiveIds:
          type: array
          items:
            $ref: '#/components/schemas/uuid'
          maxItems: 32
        lessonResourceId:
          anyOf:
            - $ref: '#/components/schemas/uuid'
            - type: 'null'
          description: 'Required when purpose is CHECKPOINT: the LESSON resource that must be content-complete before start.'
        estimatedMinutes:
          anyOf:
            - type: integer
              format: int32
            - type: 'null'
          minimum: 1
          maximum: 180
        feedbackMode:
          $ref: '#/components/schemas/AcademicAdmin.AssessmentFeedbackMode'
          description: Defaults to IMMEDIATE when omitted on save.
        passPolicy:
          anyOf:
            - $ref: '#/components/schemas/AcademicAdmin.CheckpointPassPolicy'
            - type: 'null'
          description: Required for CHECKPOINT at publish. TOPIC_PRACTICE may omit.
        remediationResourceIds:
          type: array
          items:
            $ref: '#/components/schemas/uuid'
          maxItems: 8
          description: Preferred published REMEDIATION resource ids for the fail path. Empty means resolve by shared objective/outline.
      description: Admin-authored assessment set bound to one exam language and an ordered question list. Materialized for students only after package publish.
    AcademicAdmin.AssessmentSetPurpose:
      type: string
      enum:
