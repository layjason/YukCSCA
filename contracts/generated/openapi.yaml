          minLength: 1
          maxLength: 160
        editionLabel:
          type: string
          minLength: 1
          maxLength: 80
        sourceLinks:
          type: array
          items:
            $ref: '#/components/schemas/AcademicAdmin.OfficialSourceLink'
          maxItems: 2
          description: Official PDF locators by language edition. CSCA subjects with dual exam languages typically store both en and zh-CN; Chinese-only subjects store one. Not YukCSCA outline summary languages.
        retrievedAt:
          type: string
          format: date-time
        lastCheckedAt:
          type: string
          format: date-time
        publishedOn:
          $ref: '#/components/schemas/AcademicAdmin.OfficialDate'
        effectiveOn:
          $ref: '#/components/schemas/AcademicAdmin.OfficialDate'
        updatedOn:
          $ref: '#/components/schemas/AcademicAdmin.OfficialDate'
        examStructure:
          $ref: '#/components/schemas/AcademicAdmin.ExamStructure'
        permittedUse:
