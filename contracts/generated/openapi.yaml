            - $ref: '#/components/schemas/AssessmentStudent.LanguageHelpView'
            - type: 'null'
          description: Present only after the student discloses Language help on this item. Null or omitted on first paint so the stem stays clean.
      description: One session item. Pre-submit payloads omit correct keys and undisclosed hint bodies; hintLadder exposes strength metadata only; languageHelpAvailable is first-paint Language-help chrome metadata.
    AssessmentStudent.SessionResult:
      type: object
      required:
        - sessionId
        - status
        - purpose
        - correctCount
        - total
        - strongAssistanceUsed
        - checkpointPassed
        - mistakeIds
        - evidenceWritten
        - items
        - context
        - submittedAt
      properties:
        sessionId:
          $ref: '#/components/schemas/uuid'
        status:
          type: string
          enum:
            - SUBMITTED
        purpose:
          $ref: '#/components/schemas/AssessmentStudent.AssessmentSessionPurpose'
        correctCount:
          type: integer
          format: int32
          minimum: 0
        total:
          type: integer
          format: int32
          minimum: 1
        strongAssistanceUsed:
          type: boolean
        checkpointPassed:
          anyOf:
            - type: boolean
            - type: 'null'
        mistakeIds:
          type: array
          items:
            $ref: '#/components/schemas/uuid'
          maxItems: 12
        evidenceWritten:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentStudent.LearningEvidenceSnapshot'
          description: Objective evidence written on this submit when checkpoint passed; empty otherwise.
        items:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentStudent.SessionItemView'
        context:
          $ref: '#/components/schemas/AssessmentStudent.AssessmentContextSummary'
        submittedAt:
          type: string
          format: date-time
      description: Final scored session result. checkpointPassed is non-null only for CHECKPOINT purpose.
    AssessmentStudent.StartAssessmentSessionRequest:
      type: object
      required:
        - purpose
        - subject
        - setId
        - examLanguage
      properties:
        purpose:
          $ref: '#/components/schemas/AcademicAdmin.AssessmentSetPurpose'
        subject:
          $ref: '#/components/schemas/AcademicAdmin.AcademicSubject'
        setId:
          $ref: '#/components/schemas/uuid'
        examLanguage:
          $ref: '#/components/schemas/AcademicAdmin.ExamLanguage'
        planTaskId:
          anyOf:
            - $ref: '#/components/schemas/uuid'
            - type: 'null'
          description: Reserved for plan-assigned practice (VS-017). Must be null or omitted in VS-009.
      description: Start CHECKPOINT or TOPIC_PRACTICE. REVALIDATION uses startRevalidation.
    AssessmentStudent.SubmitItemAnswerRequest:
      type: object
      required:
        - selectedOptionKey
      properties:
        selectedOptionKey:
          type: string
          minLength: 1
          maxLength: 40
    AssessmentStudent.UpdateMistakeAnnotationRequest:
      type: object
      properties:
        errorCause:
          anyOf:
            - $ref: '#/components/schemas/AssessmentStudent.ErrorCause'
            - type: 'null'
          description: Omit to leave unchanged; null clears.
        privateNote:
          anyOf:
            - type: string
            - type: 'null'
          maxLength: 2000
          description: Omit to leave unchanged; null clears.
    Auth.AuthResponse:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresInSeconds
        - user
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
            - Bearer
        expiresInSeconds:
          type: integer
          format: int64
        user:
          $ref: '#/components/schemas/Auth.CurrentUser'
    Auth.CompleteCredentialVerificationRequest:
      type: object
      required:
        - token
        - password
        - termsVersion
        - privacyNoticeVersion
        - termsAccepted
        - privacyNoticeAcknowledged
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 512
        password:
          type: string
          minLength: 15
          maxLength: 128
        termsVersion:
          type: string
          minLength: 1
          maxLength: 100
        privacyNoticeVersion:
          type: string
          minLength: 1
          maxLength: 100
        termsAccepted:
          type: boolean
          enum:
            - true
        privacyNoticeAcknowledged:
          type: boolean
          enum:
            - true
    Auth.CompletePasswordRecoveryRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 512
        password:
          type: string
          minLength: 15
          maxLength: 128
    Auth.CredentialLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          maxLength: 320
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 128
    Auth.CredentialVerificationOutcome:
      type: string
      enum:
        - CREDENTIAL_ACCOUNT_CREATED
        - SIGN_IN_WITH_GOOGLE
    Auth.CredentialVerificationResult:
      type: object
      required:
        - outcome
      properties:
        outcome:
          $ref: '#/components/schemas/Auth.CredentialVerificationOutcome'
    Auth.CurrentUser:
      type: object
      required:
        - id
        - email
        - displayName
        - role
        - onboardingCompleted
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        email:
          type: string
        displayName:
          anyOf:
            - type: string
            - type: 'null'
        avatarUrl:
          anyOf:
            - type: string
            - type: 'null'
        role:
          $ref: '#/components/schemas/Auth.UserRole'
        onboardingCompleted:
          type: boolean
    Auth.GoogleLoginRequest:
      type: object
      required:
        - credential
      properties:
        credential:
          type: string
          minLength: 20
          maxLength: 10000
      description: A browser credential returned by Google Identity Services.
    Auth.PasswordRecoveryRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          maxLength: 320
          format: email
    Auth.ResendCredentialVerificationRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          maxLength: 320
          format: email
    Auth.StartCredentialRegistrationRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          maxLength: 320
          format: email
    Auth.UserRole:
      type: string
      enum:
        - UNASSIGNED
        - STUDENT
        - PARENT
        - TUTOR
        - ADMIN
    FormalAssistanceDisabledProblem:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - FORMAL_ASSISTANCE_DISABLED
      allOf:
        - $ref: '#/components/schemas/Problem'
      description: Reserved deny when a formal timed mock is active. Language help and notebook writes stay off.
    Problem:
      type: object
      required:
        - status
        - title
        - code
      properties:
        status:
          type: integer
          format: int32
        type:
          type: string
        title:
          type: string
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
    Profile.ActivateStudentProfileRequest:
      type: object
      required:
        - preferredName
        - birthYear
        - currentGrade
        - city
        - defaultExplanationLanguage
      properties:
        preferredName:
          type: string
          minLength: 1
          maxLength: 160
          description: The student's explicitly confirmed preferred name. Provider profile data is only an editable suggestion.
        birthYear:
          type: integer
          format: int32
          description: A birth year in the inclusive range from the current Asia/Jakarta year minus 21 through the current year minus 12.
        currentGrade:
          $ref: '#/components/schemas/Profile.StudentGrade'
        city:
          type: string
          minLength: 1
          maxLength: 120
        defaultExplanationLanguage:
          $ref: '#/components/schemas/Profile.ExplanationLanguage'
    Profile.ExplanationLanguage:
      type: string
      enum:
        - id
        - en
        - zh-CN
    Profile.FieldViolation:
      type: object
      required:
        - field
        - code
      properties:
        field:
          $ref: '#/components/schemas/Profile.StudentActivationField'
        code:
          $ref: '#/components/schemas/Profile.FieldViolationCode'
    Profile.FieldViolationCode:
      type: string
      enum:
        - REQUIRED
        - TOO_LONG
        - OUT_OF_RANGE
        - UNSUPPORTED
    Profile.StudentActivationField:
      type: string
      enum:
        - preferredName
        - birthYear
        - currentGrade
        - city
        - defaultExplanationLanguage
    Profile.StudentActivationResult:
      type: object
      required:
        - profile
        - authentication
      properties:
        profile:
          $ref: '#/components/schemas/Profile.StudentProfile'
        authentication:
          $ref: '#/components/schemas/Auth.AuthResponse'
    Profile.StudentGrade:
      type: string
      enum:
        - GRADE_10
        - GRADE_11
        - GRADE_12
        - OTHER
    Profile.StudentProfile:
      type: object
      required:
        - id
        - preferredName
        - birthYear
        - currentGrade
        - city
        - defaultExplanationLanguage
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        preferredName:
          type: string
        birthYear:
          type: integer
          format: int32
        currentGrade:
          $ref: '#/components/schemas/Profile.StudentGrade'
        city:
          type: string
        defaultExplanationLanguage:
          $ref: '#/components/schemas/Profile.ExplanationLanguage'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Profile.UpdateMyStudentProfileRequest:
      type: object
      properties:
        preferredName:
          type: string
          minLength: 1
          maxLength: 160
        birthYear:
          type: integer
          format: int32
          description: A corrected birth year in the inclusive range from the current Asia/Jakarta year minus 21 through the current year minus 12. It is not legal-age verification.
        currentGrade:
          $ref: '#/components/schemas/Profile.StudentGrade'
        city:
          type: string
          minLength: 1
          maxLength: 120
        defaultExplanationLanguage:
          $ref: '#/components/schemas/Profile.ExplanationLanguage'
          description: Changes explanatory content defaults only; it does not change interface or exam language.
      description: A partial update to the authenticated student's own profile. Omitted fields remain unchanged; an empty or identical update is a successful no-op.
    Profile.ValidationProblem:
      type: object
      required:
        - code
        - violations
      properties:
        code:
          type: string
          enum:
            - VALIDATION_FAILED
        violations:
          type: array
          items:
            $ref: '#/components/schemas/Profile.FieldViolation'
      allOf:
        - $ref: '#/components/schemas/Problem'
    uuid:
      type: string
      format: uuid
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
