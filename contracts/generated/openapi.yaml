openapi: 3.1.0
info:
  title: YukCSCA API
  version: 0.1.0
  summary: Contract-first API for YukCSCA
tags: []
paths:
  /api/v1/auth/credential-registrations:
    post:
      operationId: AuthApi_startCredentialRegistration
      description: Accepts a credential-registration request without revealing whether the canonical email is eligible or already owned.
      parameters: []
      responses:
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: true
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth.StartCredentialRegistrationRequest'
  /api/v1/auth/credential-verifications/complete:
    post:
      operationId: AuthApi_completeCredentialVerification
      description: Consumes a valid verification claim after explicit password and policy confirmation. It never creates a session.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth.CredentialVerificationResult'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: true
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth.CompleteCredentialVerificationRequest'
  /api/v1/auth/credential-verifications/resend:
    post:
      operationId: AuthApi_resendCredentialVerification
      description: Accepts a verification resend request without revealing whether the canonical email is eligible or already owned.
      parameters: []
      responses:
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: true
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth.ResendCredentialVerificationRequest'
  /api/v1/auth/credentials/login:
    post:
      operationId: AuthApi_credentialLogin
      description: Authenticates an existing email credential through the shared access-token and rotating refresh-cookie lifecycle.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth.AuthResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Access is unauthorized.
          headers:
            WWW-Authenticate:
              required: false
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: true
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth.CredentialLoginRequest'
  /api/v1/auth/google:
    post:
      operationId: AuthApi_googleLogin
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth.AuthResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Access is unauthorized.
          headers:
            WWW-Authenticate:
              required: false
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: true
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth.GoogleLoginRequest'
  /api/v1/auth/logout:
    post:
      operationId: AuthApi_logout
      parameters:
        - name: yukcsca_refresh
          in: cookie
          required: false
          schema:
            type: string
          explode: false
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/me:
    get:
      operationId: AuthApi_me
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth.CurrentUser'
        '401':
          description: Access is unauthorized.
          headers:
            WWW-Authenticate:
              required: false
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        - BearerAuth: []
  /api/v1/auth/password-recoveries/complete:
    post:
      operationId: AuthApi_completePasswordRecovery
      description: Consumes a valid single-use recovery credential, replaces the password, and revokes every active refresh session without issuing a new session.
      parameters: []
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: true
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth.CompletePasswordRecoveryRequest'
  /api/v1/auth/password-recovery-requests:
    post:
      operationId: AuthApi_requestPasswordRecovery
      description: Accepts a password-recovery request without revealing whether the canonical email belongs to an eligible credential account.
      parameters: []
      responses:
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: true
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth.PasswordRecoveryRequest'
  /api/v1/auth/refresh:
    post:
      operationId: AuthApi_refresh
      parameters:
        - name: yukcsca_refresh
          in: cookie
          required: false
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth.AuthResponse'
        '401':
          description: Access is unauthorized.
          headers:
            WWW-Authenticate:
              required: false
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: true
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/student-profile:
    post:
      operationId: StudentProfileApi_activateStudentProfile
      description: Activates the authenticated unassigned account as a student. A same-account retry returns the existing profile and replacement access state.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile.StudentActivationResult'
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile.StudentActivationResult'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Profile.ValidationProblem'
        '401':
          description: Access is unauthorized.
          headers:
            WWW-Authenticate:
              required: false
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profile.ActivateStudentProfileRequest'
      security:
        - BearerAuth: []
  /api/v1/student-profile/me:
    get:
      operationId: StudentProfileApi_getMyStudentProfile
      description: Returns the authenticated student's own profile.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              required: true
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile.StudentProfile'
        '401':
          description: Access is unauthorized.
          headers:
            WWW-Authenticate:
              required: false
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        - BearerAuth: []
    patch:
      operationId: StudentProfileApi_updateMyStudentProfile
      description: Partially updates the authenticated student's own profile. Omitted fields remain unchanged. Birth year remains bounded profile data and is not legal-age verification. Explanation language remains independent from interface and exam language.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              required: true
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile.StudentProfile'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Profile.ValidationProblem'
        '401':
          description: Access is unauthorized.
          headers:
            WWW-Authenticate:
              required: false
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profile.UpdateMyStudentProfileRequest'
      security:
        - BearerAuth: []
components:
  schemas:
    Auth.AuthResponse:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresInSeconds
        - user
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
            - Bearer
        expiresInSeconds:
          type: integer
          format: int64
        user:
          $ref: '#/components/schemas/Auth.CurrentUser'
    Auth.CompleteCredentialVerificationRequest:
      type: object
      required:
        - token
        - password
        - termsVersion
        - privacyNoticeVersion
        - termsAccepted
        - privacyNoticeAcknowledged
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 512
        password:
          type: string
          minLength: 15
          maxLength: 128
        termsVersion:
          type: string
          minLength: 1
          maxLength: 100
        privacyNoticeVersion:
          type: string
          minLength: 1
          maxLength: 100
        termsAccepted:
          type: boolean
          enum:
            - true
        privacyNoticeAcknowledged:
          type: boolean
          enum:
            - true
    Auth.CompletePasswordRecoveryRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 512
        password:
          type: string
          minLength: 15
          maxLength: 128
    Auth.CredentialLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          maxLength: 320
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 128
    Auth.CredentialVerificationOutcome:
      type: string
      enum:
        - CREDENTIAL_ACCOUNT_CREATED
        - SIGN_IN_WITH_GOOGLE
    Auth.CredentialVerificationResult:
      type: object
      required:
        - outcome
      properties:
        outcome:
          $ref: '#/components/schemas/Auth.CredentialVerificationOutcome'
    Auth.CurrentUser:
      type: object
      required:
        - id
        - email
        - displayName
        - role
        - onboardingCompleted
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        email:
          type: string
        displayName:
          anyOf:
            - type: string
            - type: 'null'
        avatarUrl:
          anyOf:
            - type: string
            - type: 'null'
        role:
          $ref: '#/components/schemas/Auth.UserRole'
        onboardingCompleted:
          type: boolean
    Auth.GoogleLoginRequest:
      type: object
      required:
        - credential
      properties:
        credential:
          type: string
          minLength: 20
          maxLength: 10000
      description: A browser credential returned by Google Identity Services.
    Auth.PasswordRecoveryRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          maxLength: 320
          format: email
    Auth.ResendCredentialVerificationRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          maxLength: 320
          format: email
    Auth.StartCredentialRegistrationRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          maxLength: 320
          format: email
    Auth.UserRole:
      type: string
      enum:
        - UNASSIGNED
        - STUDENT
        - PARENT
        - TUTOR
        - ADMIN
    Problem:
      type: object
      required:
        - status
        - title
        - code
      properties:
        status:
          type: integer
          format: int32
        type:
          type: string
        title:
          type: string
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
    Profile.ActivateStudentProfileRequest:
      type: object
      required:
        - preferredName
        - birthYear
        - currentGrade
        - city
        - defaultExplanationLanguage
      properties:
        preferredName:
          type: string
          minLength: 1
          maxLength: 160
          description: The student's explicitly confirmed preferred name. Provider profile data is only an editable suggestion.
        birthYear:
          type: integer
          format: int32
          description: A birth year in the inclusive range from the current Asia/Jakarta year minus 21 through the current year minus 12.
        currentGrade:
          $ref: '#/components/schemas/Profile.StudentGrade'
        city:
          type: string
          minLength: 1
          maxLength: 120
        defaultExplanationLanguage:
          $ref: '#/components/schemas/Profile.ExplanationLanguage'
    Profile.ExplanationLanguage:
      type: string
      enum:
        - id
        - en
        - zh-CN
    Profile.FieldViolation:
      type: object
      required:
        - field
        - code
      properties:
        field:
          $ref: '#/components/schemas/Profile.StudentActivationField'
        code:
          $ref: '#/components/schemas/Profile.FieldViolationCode'
    Profile.FieldViolationCode:
      type: string
      enum:
        - REQUIRED
        - TOO_LONG
        - OUT_OF_RANGE
        - UNSUPPORTED
    Profile.StudentActivationField:
      type: string
      enum:
        - preferredName
        - birthYear
        - currentGrade
        - city
        - defaultExplanationLanguage
    Profile.StudentActivationResult:
      type: object
      required:
        - profile
        - authentication
      properties:
        profile:
          $ref: '#/components/schemas/Profile.StudentProfile'
        authentication:
          $ref: '#/components/schemas/Auth.AuthResponse'
    Profile.StudentGrade:
      type: string
      enum:
        - GRADE_10
        - GRADE_11
        - GRADE_12
        - OTHER
    Profile.StudentProfile:
      type: object
      required:
        - id
        - preferredName
        - birthYear
        - currentGrade
        - city
        - defaultExplanationLanguage
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        preferredName:
          type: string
        birthYear:
          type: integer
          format: int32
        currentGrade:
          $ref: '#/components/schemas/Profile.StudentGrade'
        city:
          type: string
        defaultExplanationLanguage:
          $ref: '#/components/schemas/Profile.ExplanationLanguage'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Profile.UpdateMyStudentProfileRequest:
      type: object
      properties:
        preferredName:
          type: string
          minLength: 1
          maxLength: 160
        birthYear:
          type: integer
          format: int32
          description: A corrected birth year in the inclusive range from the current Asia/Jakarta year minus 21 through the current year minus 12. It is not legal-age verification.
        currentGrade:
          $ref: '#/components/schemas/Profile.StudentGrade'
        city:
          type: string
          minLength: 1
          maxLength: 120
        defaultExplanationLanguage:
          $ref: '#/components/schemas/Profile.ExplanationLanguage'
          description: Changes explanatory content defaults only; it does not change interface or exam language.
      description: A partial update to the authenticated student's own profile. Omitted fields remain unchanged; an empty or identical update is a successful no-op.
    Profile.ValidationProblem:
      type: object
      required:
        - code
        - violations
      properties:
        code:
          type: string
          enum:
            - VALIDATION_FAILED
        violations:
          type: array
          items:
            $ref: '#/components/schemas/Profile.FieldViolation'
      allOf:
        - $ref: '#/components/schemas/Problem'
    uuid:
      type: string
      format: uuid
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
