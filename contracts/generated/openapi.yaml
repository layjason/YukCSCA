        displayMode:
          type: boolean
    AcademicAdmin.MockPaper:
      type: object
      required:
        - id
        - questions
        - provenance
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        title:
          type: string
          minLength: 1
          maxLength: 200
        examLanguage:
          $ref: '#/components/schemas/AcademicAdmin.ExamLanguage'
        durationMinutes:
          type: integer
          format: int32
          minimum: 1
          maximum: 300
        totalPoints:
