            Pragma:
              required: true
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicStudent.PublishedLessonDetail'
        '400':
          description: The server could not understand the request due to invalid syntax.
